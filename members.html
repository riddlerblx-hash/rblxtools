1px solid rgba(210,220,232,.45);border-radius:0;outline:0;color:#edf5ff;background:transparent;font:600 13px/36px Arial}.member-comment-form input:focus{border-bottom-color:#eff6ff}.member-comment-form input::placeholder{color:#aab5c4;opacity:1}.member-comment-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;min-height:42px;margin-left:50px;padding:8px 0 0}.member-comment-actions button{min-width:76px;height:34px;border:0;border-radius:999px;padding:0 15px;font:800 12px Arial;cursor:pointer}.member-comment-cancel{min-width:68px!important;color:#f4f5f7;background:#34363a}.member-comment-submit{color:#111820;background:#f4f5f7}.member-comment-status{min-height:16px;margin:4px 0 0 50px;color:#aebfd5;font-size:11px;font-weight:700}@media(max-width:650px){.member-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.member-ad{min-height:72px}.member-ad iframe{transform:scale(.9);transform-origin:center}}@media(max-width:410px){.member-stats{grid-template-columns:1fr 1fr}}

    .member-follow{align-self:center;margin-left:auto;border:1px solid rgba(128,225,120,.65);border-radius:9px;padding:8px 12px;color:#d7ffd0;background:rgba(64,153,62,.2);font:900 11px Inter,Arial,sans-serif;cursor:pointer}.member-follow.is-following{border-color:rgba(143,188,244,.45);color:#dceeff;background:rgba(86,145,207,.17)}.member-reactions{display:flex;gap:7px;margin-top:15px}.member-reaction{display:inline-flex;align-items:center;gap:6px;min-height:32px;border:1px solid rgba(143,188,244,.28);border-radius:9px;padding:0 10px;color:#c9d8eb;background:rgba(13,26,43,.64);font:800 11px Inter,Arial,sans-serif}.member-reaction[data-member-reaction]{cursor:pointer}.member-reaction[data-member-reaction]:hover,.member-reaction.is-active{border-color:#76b9ff;color:#fff;background:rgba(56,120,200,.24)}.member-reaction.is-dislike.is-active{border-color:#ff8e9a;background:rgba(176,49,68,.22)}.member-ad{position:relative;min-height:122px}.member-ad-desktop,.member-ad-mobile{display:block}.member-ad-mobile{display:none}.member-ad-progress{width:min(728px,100%);height:3px;overflow:hidden;margin-top:7px;border-radius:99px;background:rgba(135,165,213,.19)}.member-ad-progress i{display:block;width:100%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#66c8ff,#8271ff);transform:scaleX(0);transform-origin:left}@media(max-width:650px){.member-ad{min-height:82px}.member-ad-desktop{display:none}.member-ad-mobile{display:block}.member-ad iframe{transform:none}}

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <main class="members-page">
    <a class="member-back" id="memberBack" href="/community">← Back to Community</a>
    <section class="member-card" id="memberCard" aria-live="polite"><div class="member-state"><h1>Loading member profile…</h1><p>Getting the latest public profile details.</p></div></section>
    <div class="member-content" id="memberContent" hidden></div>
  </main>
  <script>
    (function(){
      var card=document.getElementById('memberCard');
      var content=document.getElementById('memberContent');
      var back=document.getElementById('memberBack');
      function authHeaders(extra){var headers=extra||{};var token='';try{token=localStorage.getItem('rblxtools_auth_token')||'';}catch(_error){}if(token)headers.Authorization='Bearer '+token;return headers;}
      (function configureBackLink(){var source='';try{source=document.referrer?new URL(document.referrer):null;}catch(_error){}if(!source||source.origin!==location.origin)return;var path=source.pathname.replace(/\/$/,'')||'/';var labels={'/community':'Community','/codes':'Roblox Codes','/clothing':'Clothing','/ai-ugc-studio':'AI UGC Studio','/account-overview':'Account Center'};var label=labels[path]||'previous page';back.textContent='← Back to '+label;back.href=source.href;})();
      function escapeHtml(value){return String(value||'').replace(/[&<>"']/g,function(char){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[char];});}
      function initials(value){return String(value||'Member').trim().split(/\s+/).slice(0,2).map(function(part){return part.charAt(0).toUpperCase();}).join('')||'M';}
      function failure(title,message){card.innerHTML='<div class="member-state"><h1>'+escapeHtml(title)+'</h1><p>'+escapeHtml(message)+'</p></div>';}
      function profileCommentsMarkup(comments){if(!comments.length)return '<p class="member-empty">No comments yet. Start the conversation.</p>';return '<div class="member-profile-comments">'+comments.map(function(comment){var avatar=comment.avatarUrl?'<img src="'+escapeHtml(comment.avatarUrl)+'" alt="">':escapeHtml(initials(comment.authorName));var when=comment.createdAt?new Date(comment.createdAt).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'';return '<article class="member-profile-comment"><a class="member-comment-avatar" href="/members/'+encodeURIComponent(comment.userId)+'">'+avatar+'</a><div class="member-comment-copy"><a href="/members/'+encodeURIComponent(comment.userId)+'">'+escapeHtml(comment.authorName)+'</a><time>'+escapeHtml(when)+'</time><p>'+escapeHtml(comment.body)+'</p></div></article>';}).join('')+'</div>';}
      function profileContentMarkup(payload){var assets=payload.aiAssets||[],codes=payload.codePosts||[],comments=payload.comments||[];var assetMarkup=assets.length?'<div class="member-asset-grid">'+assets.map(function(asset){var cover=asset.thumbnailUrl?'<img src="'+escapeHtml(asset.thumbnailUrl)+'" alt="'+escapeHtml(asset.title||'UGC asset')+'" data-member-asset-cover="'+escapeHtml(asset.id)+'" loading="eager" decoding="async" onerror="this.dataset.coverFailed=\'true\'">':'';return '<a class="member-asset" href="/community#asset-'+encodeURIComponent(asset.id)+'">'+cover+'<span class="member-card-copy"><strong>'+escapeHtml(asset.title||'AI asset')+'</strong><small>'+Number(asset.views||0)+' views · '+(asset.rating?escapeHtml(asset.rating)+' ★':'New')+'</small></span></a>';}).join('')+'</div>':'<p class="member-empty">No public AI assets yet.</p>';var codeMarkup=codes.length?'<div class="member-code-grid">'+codes.map(function(code){return '<a class="member-code" href="/codes/'+encodeURIComponent(code.slug)+'">'+(code.icon?'<img src="'+escapeHtml(code.icon)+'" alt="">':'<span class="member-code-fallback">CODE</span>')+'<span class="member-code-copy"><strong>'+escapeHtml(code.name)+'</strong><small>'+Number(code.workingCodeCount||0)+' codes · '+Number(code.viewCount||0)+' views</small></span></a>';}).join('')+'</div>':'<p class="member-empty">No published code posts yet.</p>';return '<section class="member-section"><h2>AI Assets ('+assets.length+')</h2>'+assetMarkup+'</section><section class="member-section"><h2>Code posts ('+codes.length+')</h2>'+codeMarkup+'</section><section class="member-section"><h2>Profile comments ('+comments.length+')</h2>'+profileCommentsMarkup(comments)+'<form class="member-comment-form" id="memberCommentForm"><textarea maxlength="600" required placeholder="Leave a comment on this profile..."></textarea><p class="member-comment-status" id="memberCommentStatus"></p><button type="submit">Post comment</button></form></section>';}
      function renderProfileAssetModelCover(image){var assetId=String(image.dataset.memberAssetCover||'');if(!assetId||image.dataset.modelCoverLoading)return;image.dataset.modelCoverLoading='true';if(!window.THREE||!THREE.GLTFLoader)return;fetch('/api/ugc/community/'+encodeURIComponent(assetId)+'/model',{credentials:'include'}).then(function(response){if(!response.ok)throw new Error('Could not load model');return response.arrayBuffer();}).then(function(buffer){var loader=new THREE.GLTFLoader();return new Promise(function(resolve,reject){loader.parse(buffer,'',resolve,reject);});}).then(function(gltf){if(!image.isConnected)return;var width=Math.max(160,image.clientWidth),height=Math.max(128,image.clientHeight);var renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));renderer.setSize(width,height,false);renderer.outputEncoding=THREE.sRGBEncoding;var scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xeaf3ff,0x0a121e,1.55));var key=new THREE.DirectionalLight(0xffffff,1.9);key.position.set(3,4,5);scene.add(key);var rim=new THREE.DirectionalLight(0x79b5ff,1.15);rim.position.set(-4,2,-3);scene.add(rim);var content=new THREE.Group();content.add(gltf.scene);var box=new THREE.Box3().setFromObject(content),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3()),maxDimension=Math.max(size.x,size.y,size.z)||1;content.position.sub(center);content.scale.setScalar(2.35/maxDimension);content.rotation.y=-.35;scene.add(content);var camera=new THREE.PerspectiveCamera(34,width/height,.01,1000);camera.position.set(0,.08,4.2);camera.lookAt(0,0,0);renderer.render(scene,camera);image.removeAttribute('onerror');image.src=renderer.domElement.toDataURL('image/png');image.dataset.coverFailed='';renderer.dispose();}).catch(function(){});}
      function bindProfileAssetCovers(root){Array.prototype.forEach.call(root.querySelectorAll('[data-member-asset-cover]'),function(image){var loadModel=function(){renderProfileAssetModelCover(image);};image.addEventListener('error',loadModel,{once:true});if(image.dataset.coverFailed==='true'||(image.complete&&!image.naturalWidth))loadModel();});}
      var memberId=decodeURIComponent(location.pathname.replace(/^\/members\/?/,'').split('/')[0]||'');
      if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(memberId)){failure('Member not found','That profile link is not valid.');return;}
      fetch('/api/members/'+encodeURIComponent(memberId),{credentials:'include',headers:authHeaders()}).then(function(response){return response.json().then(function(payload){if(!response.ok)throw new Error(payload.error||'This member is unavailable.');return payload;});}).then(function(payload){
        var member=payload.member||{},plan=String(member.plan||'free').toLowerCase(),joined=member.joinedAt?new Date(member.joinedAt):null,joinedText=joined&&!isNaN(joined.getTime())?joined.toLocaleDateString(undefined,{month:'long',year:'numeric'}):'Recently';
        var avatar=member.avatarUrl?'<img src="'+escapeHtml(member.avatarUrl)+'" alt="">':escapeHtml(initials(member.name));
        var planLabel=plan==='pro'?'Pro&nbsp;Plan':plan==='plus'?'Plus&nbsp;Plan':'',rankLabel='Level '+Number(member.level||1)+' · '+String(member.levelTitle||'Builder');
        var stats=payload.stats||{};
        var adminIdMarkup=payload.canViewMemberId?'<div style="display:flex;align-items:center;gap:5px;max-width:100%;margin-top:7px;color:#8498b0;font-size:9px;font-weight:750;letter-spacing:.015em">User ID: <code style="overflow:hidden;color:inherit;font:inherit;text-overflow:ellipsis;white-space:nowrap">'+escapeHtml(memberId)+'</code><button type="button" data-copy-member-id aria-label="Copy user ID" title="Copy user ID" style="display:grid;place-items:center;width:18px;height:18px;flex:0 0 auto;border:0;padding:0;color:#a9c9eb;background:transparent;font:900 14px/1 Arial,sans-serif;cursor:pointer">⧉</button></div>':'';
        var reactionMarkup='<div class="member-reactions">'+(payload.canReact?'<button type="button" class="member-reaction '+(payload.viewerProfileReaction==='like'?'is-active':'')+'" data-member-reaction="like">♡ Like <span data-member-likes>'+Number(payload.profileLikes||0)+'</span></button><button type="button" class="member-reaction is-dislike '+(payload.viewerProfileReaction==='dislike'?'is-active':'')+'" data-member-reaction="dislike">♧ Dislike <span data-member-dislikes>'+Number(payload.profileDislikes||0)+'</span></button>':'<span class="member-reaction">♡ '+Number(payload.profileLikes||0)+'</span><span class="member-reaction is-dislike">♧ '+Number(payload.profileDislikes||0)+'</span>')+'</div>';
        card.className='member-card'+(plan==='pro'?' is-pro':plan==='plus'?' is-plus':'');
        card.innerHTML='<div class="member-card-inner"><div class="member-top"><div class="member-avatar">'+avatar+'</div><div class="member-copy"><h1>'+escapeHtml(member.name||'Member')+'</h1>'+(planLabel?'<span class="member-plan '+(plan==='pro'?'is-pro':'is-plus')+'">'+planLabel+'</span>':'')+'<span class="member-handle">'+escapeHtml(rankLabel)+'</span>'+adminIdMarkup+'</div>'+(payload.canFollow?'<button type="button" class="member-follow'+(payload.viewerFollowing?' is-following':'')+'" data-member-follow>'+ (payload.viewerFollowing?'Following':'Follow') +'</button>':'')+'</div>'+reactionMarkup+'<div class="member-stats"><div class="member-stat"><strong data-member-follower-count>'+Number(payload.followerCount||0)+'</strong>Followers</div><div class="member-stat"><strong>'+Number(payload.followingCount||0)+'</strong>Following</div><div class="member-stat"><strong>'+Number(stats.aiTokensTipped||0).toLocaleString()+'</strong>Tokens tipped</div><div class="member-stat"><strong>'+Number(stats.codeVotes||0)+'</strong>Code votes</div><div class="member-stat"><strong>'+Number(stats.codeReports||0)+'</strong>Reports</div></div></div>';
        var avatarImage=card.querySelector('.member-avatar img');
        if(avatarImage) avatarImage.addEventListener('error',function(){avatarImage.remove();var avatarNode=card.querySelector('.member-avatar');if(avatarNode)avatarNode.textContent=initials(member.name);},{once:true});
        var copyMemberId=card.querySelector('[data-copy-member-id]');if(copyMemberId)copyMemberId.addEventListener('click',function(){var original=copyMemberId.textContent;if(!navigator.clipboard||!navigator.clipboard.writeText)return;navigator.clipboard.writeText(memberId).then(function(){copyMemberId.textContent='✓';window.setTimeout(function(){copyMemberId.textContent=original;},1200);}).catch(function(){});});
        var followButton=card.querySelector('[data-member-follow]');if(followButton)followButton.addEventListener('click',function(){followButton.disabled=true;fetch('/api/ugc/community/creators/'+encodeURIComponent(memberId)+'/follow',{method:'POST',credentials:'include',headers:authHeaders({'Content-Type':'application/json'})}).then(function(response){return response.json().then(function(result){if(!response.ok)throw new Error(result.error||'Could not update follow.');return result;});}).then(function(result){payload.viewerFollowing=Boolean(result.following);payload.followerCount=Number(result.followers||0);followButton.textContent=payload.viewerFollowing?'Following':'Follow';followButton.classList.toggle('is-following',payload.viewerFollowing);var followerCount=card.querySelector('[data-member-follower-count]');if(followerCount)followerCount.textContent=payload.followerCount;}).catch(function(error){alert(error.message||'Could not update follow.');}).finally(function(){followButton.disabled=false;});});
        Array.prototype.forEach.call(card.querySelectorAll('[data-member-reaction]'),function(button){button.addEventListener('click',function(){var reaction=button.dataset.memberReaction;button.disabled=true;fetch('/api/members/'+encodeURIComponent(memberId)+'/reaction',{method:'POST',credentials:'include',headers:authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({reaction:reaction})}).then(function(response){return response.json().then(function(result){if(!response.ok)throw new Error(result.error||'Could not update reaction.');return result;});}).then(function(result){payload.viewerProfileReaction=result.reaction;payload.profileLikes=result.likes;payload.profileDislikes=result.dislikes;Array.prototype.forEach.call(card.querySelectorAll('[data-member-reaction]'),function(item){item.classList.toggle('is-active',item.dataset.memberReaction===result.reaction);});card.querySelector('[data-member-likes]').textContent=result.likes;card.querySelector('[data-member-dislikes]').textContent=result.dislikes;}).catch(function(error){alert(error.message||'Could not update reaction.');}).finally(function(){button.disabled=false;});});});
        function renderProfileContent(){content.innerHTML=profileContentMarkup(payload);content.hidden=false;bindProfileAssetCovers(content);if(typeof mountProfileAds==='function')mountProfileAds(payload);var form=content.querySelector('#memberCommentForm'),status=content.querySelector('#memberCommentStatus');if(form)form.addEventListener('submit',function(event){event.preventDefault();var textarea=form.querySelector('textarea'),button=form.querySelector('button'),body=textarea.value.trim();if(!body)return;button.disabled=true;status.textContent='Posting…';fetch('/api/members/'+encodeURIComponent(memberId)+'/comments',{method:'POST',credentials:'include',headers:authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({body:body})}).then(function(response){return response.json().then(function(result){if(!response.ok)throw new Error(result.error||'Could not post your comment.');return result;});}).then(function(result){payload.comments=(payload.comments||[]).concat([result.comment]);renderProfileContent();}).catch(function(error){status.textContent=error.message||'Could not post your comment.';button.disabled=false;});});}
        renderProfileContent();
        document.title=(member.name||'Member')+' | RBLXTools';
      }).catch(function(error){failure('Member unavailable',error.message||'This profile could not be loaded.');});
    }());
  </script>
