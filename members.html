<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Member profile | RBLXTools</title>
  <link rel="stylesheet" href="/global-shell.css?v=20260917-members">
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{min-height:100vh;margin:0;color:#edf5ff;background:radial-gradient(circle at 12% 5%,rgba(75,131,255,.2),transparent 27%),radial-gradient(circle at 85% 15%,rgba(76,228,212,.08),transparent 22%),#08111f;font-family:Inter,Arial,sans-serif}.members-page{width:min(760px,calc(100% - 32px));margin:0 auto;padding:64px 0 90px}.member-card{position:relative;overflow:hidden;border:1px solid rgba(131,179,243,.34);border-radius:24px;background:linear-gradient(145deg,rgba(25,45,75,.98),rgba(11,21,37,.98));box-shadow:0 28px 70px rgba(0,0,0,.32)}.member-card:before{position:absolute;inset:0;background:radial-gradient(circle at top right,rgba(123,166,255,.2),transparent 35%);content:"";pointer-events:none}.member-card-inner{position:relative;padding:34px}.member-kicker{margin:0 0 12px;color:#8bc7ff;font-size:11px;font-weight:900;letter-spacing:.13em;text-transform:uppercase}.member-top{display:flex;align-items:center;gap:18px}.member-avatar{display:grid;place-items:center;width:92px;height:92px;flex:0 0 auto;overflow:hidden;border:2px solid rgba(149,201,255,.76);border-radius:50%;color:#eff7ff;background:linear-gradient(145deg,#355981,#192b43);font-size:28px;font-weight:900;box-shadow:0 12px 30px rgba(0,0,0,.24)}.member-avatar img{width:100%;height:100%;object-fit:cover}.member-copy{min-width:0}.member-copy h1{overflow:hidden;margin:0;color:#fff;font-size:clamp(28px,5vw,42px);letter-spacing:-.055em;text-overflow:ellipsis;white-space:nowrap}.member-handle{margin:6px 0 0;color:#aabed7;font-size:14px;font-weight:700}.member-plan{display:inline-flex;align-items:center;min-height:27px;margin-top:14px;border:1px solid rgba(126,187,255,.45);border-radius:999px;padding:0 11px;color:#dff2ff;background:rgba(100,166,255,.13);font-size:11px;font-weight:900;text-transform:uppercase}.member-plan.is-plus{border-color:rgba(107,240,201,.52);color:#bfffe9;background:rgba(52,206,152,.13)}.member-plan.is-pro{border-color:rgba(255,203,79,.58);color:#ffe19a;background:rgba(255,193,52,.13)}.member-meta{display:grid;grid-template-columns:1fr;gap:8px;margin-top:27px;border-top:1px solid rgba(181,209,247,.16);padding-top:22px;color:#b5c4d8;font-size:13px}.member-meta strong{display:block;margin-top:4px;color:#eff6ff;font-size:15px}.member-state{padding:54px 28px;color:#b6c6db;text-align:center}.member-state h1{margin:0 0 9px;color:#f6f9ff;font-size:26px}.member-state p{margin:0;font-size:14px;line-height:1.55}.member-back{display:inline-block;margin-bottom:15px;color:#9ed1ff;font-size:12px;font-weight:900;text-decoration:none}.member-back:hover{text-decoration:underline}@media(max-width:600px){.members-page{width:min(100% - 20px,760px);padding:26px 0 54px}.member-card-inner{padding:24px 18px}.member-top{align-items:flex-start;gap:13px}.member-avatar{width:68px;height:68px;font-size:21px}.member-copy h1{font-size:27px}}
  </style>
  <style>
    .member-content{display:grid;gap:16px;margin-top:16px}.member-section{padding:20px;border:1px solid rgba(131,179,243,.26);border-radius:18px;background:rgba(12,24,41,.82)}.member-section h2{margin:0 0 14px;color:#f7faff;font-size:20px;letter-spacing:-.035em}.member-empty{margin:0;color:#aebfd5;font-size:13px}.member-asset-grid,.member-code-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.member-asset,.member-code{overflow:hidden;border:1px solid rgba(143,188,244,.23);border-radius:12px;color:#eef6ff;background:#101d2f;text-decoration:none}.member-asset:hover,.member-code:hover{border-color:#7fc1ff;transform:translateY(-2px)}.member-asset img,.member-asset-fallback{display:block;width:100%;aspect-ratio:1.25;object-fit:cover;background:#182b43}.member-asset-fallback{display:grid;place-items:center;color:#bcd8ff;font-size:12px;font-weight:900}.member-card-copy{display:block;padding:9px}.member-card-copy strong{display:block;overflow:hidden;font-size:12px;text-overflow:ellipsis;white-space:nowrap}.member-card-copy small{display:block;margin-top:5px;color:#9eb3cd;font-size:10px;font-weight:700}.member-code{display:flex;gap:9px;min-height:80px;padding:9px}.member-code img,.member-code-fallback{width:62px;height:62px;flex:0 0 auto;border-radius:8px;object-fit:cover;background:#203952}.member-code-fallback{display:grid;place-items:center;color:#bbd8ff;font-size:10px;font-weight:900}.member-code-copy{min-width:0}.member-code-copy strong{display:block;overflow:hidden;margin-top:2px;font-size:12px;text-overflow:ellipsis;white-space:nowrap}.member-code-copy small{display:block;margin-top:7px;color:#8fcaff;font-size:10px;font-weight:800}.member-people{display:flex;flex-wrap:wrap;gap:9px}.member-person{display:flex;align-items:center;gap:7px;max-width:190px;border:1px solid rgba(143,188,244,.24);border-radius:999px;padding:5px 9px 5px 5px;color:#edf6ff;background:#14243a;text-decoration:none}.member-person:hover{border-color:#84c7ff}.member-person-avatar{display:grid;place-items:center;width:28px;height:28px;overflow:hidden;border-radius:50%;background:#315273;font-size:9px;font-weight:900}.member-person-avatar img{width:100%;height:100%;object-fit:cover}.member-person span:last-child{overflow:hidden;font-size:11px;font-weight:800;text-overflow:ellipsis;white-space:nowrap}@media(max-width:650px){.member-asset-grid,.member-code-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:410px){.member-asset-grid,.member-code-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <script src="/global-shell.js?v=20260917-members"></script>
  <main class="members-page">
    <a class="member-back" href="/community">← Back to Community</a>
    <section class="member-card" id="memberCard" aria-live="polite"><div class="member-state"><h1>Loading member profile…</h1><p>Getting the latest public profile details.</p></div></section>
    <div class="member-content" id="memberContent" hidden></div>
  </main>
  <script>
    (function(){
      var card=document.getElementById('memberCard');
      var content=document.getElementById('memberContent');
      function escapeHtml(value){return String(value||'').replace(/[&<>"']/g,function(char){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[char];});}
      function initials(value){return String(value||'Member').trim().split(/\s+/).slice(0,2).map(function(part){return part.charAt(0).toUpperCase();}).join('')||'M';}
      function failure(title,message){card.innerHTML='<div class="member-state"><h1>'+escapeHtml(title)+'</h1><p>'+escapeHtml(message)+'</p></div>';}
      function memberHref(id){return '/members/'+encodeURIComponent(id);}
      function peopleMarkup(people){if(!people.length)return '<p class="member-empty">Nothing to show yet.</p>';return '<div class="member-people">'+people.map(function(person){var avatar=person.avatarUrl?'<img src="'+escapeHtml(person.avatarUrl)+'" alt="">':escapeHtml(initials(person.name));return '<a class="member-person" href="'+memberHref(person.id)+'"><span class="member-person-avatar">'+avatar+'</span><span>'+escapeHtml(person.name)+'</span></a>';}).join('')+'</div>';}
      function profileContentMarkup(payload){var assets=payload.aiAssets||[],codes=payload.codePosts||[];var assetMarkup=assets.length?'<div class="member-asset-grid">'+assets.map(function(asset){return '<a class="member-asset" href="/community#asset-'+encodeURIComponent(asset.id)+'">'+(asset.thumbnailUrl?'<img src="'+escapeHtml(asset.thumbnailUrl)+'" alt="">':'<span class="member-asset-fallback">UGC</span>')+'<span class="member-card-copy"><strong>'+escapeHtml(asset.title||'AI asset')+'</strong><small>'+Number(asset.views||0)+' views · '+(asset.rating?escapeHtml(asset.rating)+' ★':'New')+'</small></span></a>';}).join('')+'</div>':'<p class="member-empty">No public AI assets yet.</p>';var codeMarkup=codes.length?'<div class="member-code-grid">'+codes.map(function(code){return '<a class="member-code" href="/codes/'+encodeURIComponent(code.slug)+'">'+(code.icon?'<img src="'+escapeHtml(code.icon)+'" alt="">':'<span class="member-code-fallback">CODE</span>')+'<span class="member-code-copy"><strong>'+escapeHtml(code.name)+'</strong><small>'+Number(code.workingCodeCount||0)+' codes · '+Number(code.viewCount||0)+' views</small></span></a>';}).join('')+'</div>':'<p class="member-empty">No published code posts yet.</p>';return '<section class="member-section"><h2>AI Assets ('+assets.length+')</h2>'+assetMarkup+'</section><section class="member-section"><h2>Code posts ('+codes.length+')</h2>'+codeMarkup+'</section><section class="member-section"><h2>Followers ('+Number(payload.followerCount||0)+')</h2>'+peopleMarkup(payload.followers||[])+'</section><section class="member-section"><h2>Following ('+Number(payload.followingCount||0)+')</h2>'+peopleMarkup(payload.following||[])+'</section>';}
      var memberId=decodeURIComponent(location.pathname.replace(/^\/members\/?/,'').split('/')[0]||'');
      if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(memberId)){failure('Member not found','That profile link is not valid.');return;}
      fetch('/api/members/'+encodeURIComponent(memberId),{credentials:'include'}).then(function(response){return response.json().then(function(payload){if(!response.ok)throw new Error(payload.error||'This member is unavailable.');return payload;});}).then(function(payload){
        var member=payload.member||{},plan=String(member.plan||'free').toLowerCase(),joined=member.joinedAt?new Date(member.joinedAt):null,joinedText=joined&&!isNaN(joined.getTime())?joined.toLocaleDateString(undefined,{month:'long',year:'numeric'}):'Recently';
        var avatar=member.avatarUrl?'<img src="'+escapeHtml(member.avatarUrl)+'" alt="">':escapeHtml(initials(member.name));
        card.innerHTML='<div class="member-card-inner"><p class="member-kicker">RBLXTools member</p><div class="member-top"><div class="member-avatar">'+avatar+'</div><div class="member-copy"><h1>'+escapeHtml(member.name||'Member')+'</h1><p class="member-handle">@'+escapeHtml(member.username||'member')+'</p><span class="member-plan '+(plan==='pro'?'is-pro':plan==='plus'?'is-plus':'')+'">'+escapeHtml(plan)+' member</span></div></div><div class="member-meta"><div>Member since<strong>'+escapeHtml(joinedText)+'</strong></div></div></div>';
        var avatarImage=card.querySelector('.member-avatar img');
        if(avatarImage) avatarImage.addEventListener('error',function(){avatarImage.remove();var avatarNode=card.querySelector('.member-avatar');if(avatarNode)avatarNode.textContent=initials(member.name);},{once:true});
        content.innerHTML=profileContentMarkup(payload);content.hidden=false;
        document.title=(member.name||'Member')+' | RBLXTools';
      }).catch(function(error){failure('Member unavailable',error.message||'This profile could not be loaded.');});
    }());
  </script>
</body>
</html>
