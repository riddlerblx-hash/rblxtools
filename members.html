  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{min-height:100vh;margin:0;color:#edf5ff;background:radial-gradient(circle at 12% 5%,rgba(75,131,255,.2),transparent 27%),radial-gradient(circle at 85% 15%,rgba(76,228,212,.08),transparent 22%),#08111f;font-family:Inter,Arial,sans-serif}.members-page{width:min(760px,calc(100% - 32px));margin:0 auto;padding:64px 0 90px}.member-card{position:relative;overflow:hidden;border:1px solid rgba(131,179,243,.34);border-radius:24px;background:linear-gradient(145deg,rgba(25,45,75,.98),rgba(11,21,37,.98));box-shadow:0 28px 70px rgba(0,0,0,.32)}.member-card:before{position:absolute;inset:0;background:radial-gradient(circle at top right,rgba(123,166,255,.2),transparent 35%);content:"";pointer-events:none}.member-card-inner{position:relative;padding:34px}.member-kicker{margin:0 0 12px;color:#8bc7ff;font-size:11px;font-weight:900;letter-spacing:.13em;text-transform:uppercase}.member-top{display:flex;align-items:center;gap:18px}.member-avatar{display:grid;place-items:center;width:92px;height:92px;flex:0 0 auto;overflow:hidden;border:2px solid rgba(149,201,255,.76);border-radius:50%;color:#eff7ff;background:linear-gradient(145deg,#355981,#192b43);font-size:28px;font-weight:900;box-shadow:0 12px 30px rgba(0,0,0,.24)}.member-avatar img{width:100%;height:100%;object-fit:cover}.member-copy{min-width:0}.member-copy h1{overflow:hidden;margin:0;color:#fff;font-size:clamp(28px,5vw,42px);letter-spacing:-.055em;text-overflow:ellipsis;white-space:nowrap}.member-handle{margin:6px 0 0;color:#aabed7;font-size:14px;font-weight:700}.member-plan{display:block;margin-top:5px;padding:0;color:#b9cbe3;background:transparent;font-size:11px;font-weight:900;letter-spacing:.04em;text-transform:uppercase}.member-plan.is-plus{color:#a7efd0}.member-plan.is-pro{color:#ffe09a}.member-meta{display:grid;grid-template-columns:1fr;gap:8px;margin-top:27px;border-top:1px solid rgba(181,209,247,.16);padding-top:22px;color:#b5c4d8;font-size:13px}.member-meta strong{display:block;margin-top:4px;color:#eff6ff;font-size:15px}.member-state{padding:54px 28px;color:#b6c6db;text-align:center}.member-state h1{margin:0 0 9px;color:#f6f9ff;font-size:26px}.member-state p{margin:0;font-size:14px;line-height:1.55}.member-back{display:inline-block;margin-bottom:15px;color:#9ed1ff;font-size:12px;font-weight:900;text-decoration:none}.member-back:hover{text-decoration:underline}@media(max-width:600px){.members-page{width:min(100% - 20px,760px);padding:26px 0 54px}.member-card-inner{padding:24px 18px}.member-top{align-items:flex-start;gap:13px}.member-avatar{width:68px;height:68px;font-size:21px}.member-copy h1{font-size:27px}}
  </style>
  <style>
    .member-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:25px;border-top:1px solid rgba(181,209,247,.16);padding-top:18px}.member-stat{min-width:0;color:#aebfd5;font-size:10px;font-weight:800;text-align:center}.member-stat strong{display:block;overflow:hidden;margin-bottom:4px;color:#f7fbff;font-size:16px;text-overflow:ellipsis;white-space:nowrap}.member-ad{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:112px;padding:10px;border:1px solid rgba(131,179,243,.22);border-radius:16px;background:rgba(8,17,31,.72)}.member-ad-label{margin-bottom:6px;color:#9db1ca;font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.member-ad iframe{display:block;max-width:100%;border:0}.member-profile-comments{display:grid;gap:10px}.member-profile-comment{display:grid;grid-template-columns:34px minmax(0,1fr);gap:9px;padding:9px 0;border-top:1px solid rgba(181,209,247,.12)}.member-profile-comment:first-of-type{border-top:0}.member-comment-avatar{display:grid;place-items:center;width:34px;height:34px;overflow:hidden;border-radius:50%;color:#fff;background:#315273;font-size:10px;font-weight:900}.member-comment-avatar img{width:100%;height:100%;object-fit:cover}.member-comment-copy{min-width:0}.member-comment-copy a{color:#eaf5ff;font-size:12px;font-weight:900;text-decoration:none}.member-comment-copy a:hover{color:#8fcbff}.member-comment-copy time{margin-left:6px;color:#92a8c1;font-size:10px;font-weight:700}.member-comment-copy p{margin:5px 0 0;color:#d4dfed;font-size:12px;line-height:1.45}.member-comment-form{display:grid;gap:8px;margin-top:10px}.member-comment-form textarea{width:100%;min-height:72px;resize:vertical;border:1px solid rgba(143,188,244,.31);border-radius:10px;padding:10px;color:#eff6ff;background:#0c1828;font:700 12px Inter,Arial,sans-serif}.member-comment-form button{justify-self:end;min-height:34px;border:0;border-radius:9px;padding:0 14px;color:#fff;background:linear-gradient(135deg,#407ec3,#65a6ec);font:900 11px Inter,Arial,sans-serif;cursor:pointer}.member-comment-status{min-height:16px;margin:0;color:#aebfd5;font-size:11px;font-weight:700}@media(max-width:650px){.member-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.member-ad{min-height:72px}.member-ad iframe{transform:scale(.9);transform-origin:center}}@media(max-width:410px){.member-stats{grid-template-columns:1fr 1fr}}
  </style>
  <style>
    .member-content{display:grid;gap:16px;margin-top:16px}.member-section{padding:20px;border:1px solid rgba(131,179,243,.26);border-radius:18px;background:rgba(12,24,41,.82)}.member-section h2{margin:0 0 14px;color:#f7faff;font-size:20px;letter-spacing:-.035em}.member-empty{margin:0;color:#aebfd5;font-size:13px}.member-asset-grid,.member-code-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.member-asset,.member-code{overflow:hidden;border:1px solid rgba(143,188,244,.23);border-radius:12px;color:#eef6ff;background:#101d2f;text-decoration:none}.member-asset:hover,.member-code:hover{border-color:#7fc1ff;transform:translateY(-2px)}.member-asset img{display:block;width:100%;aspect-ratio:1.25;object-fit:cover;background:#182b43}.member-card-copy{display:block;padding:9px}.member-card-copy strong{display:block;overflow:hidden;font-size:12px;text-overflow:ellipsis;white-space:nowrap}.member-card-copy small{display:block;margin-top:5px;color:#9eb3cd;font-size:10px;font-weight:700}.member-code{display:flex;gap:9px;min-height:80px;padding:9px}.member-code img,.member-code-fallback{width:62px;height:62px;flex:0 0 auto;border-radius:8px;object-fit:cover;background:#203952}.member-code-fallback{display:grid;place-items:center;color:#bbd8ff;font-size:10px;font-weight:900}.member-code-copy{min-width:0}.member-code-copy strong{display:block;overflow:hidden;margin-top:2px;font-size:12px;text-overflow:ellipsis;white-space:nowrap}.member-code-copy small{display:block;margin-top:7px;color:#8fcaff;font-size:10px;font-weight:800}.member-people{display:flex;flex-wrap:wrap;gap:9px}.member-person{display:flex;align-items:center;gap:7px;max-width:190px;border:1px solid rgba(143,188,244,.24);border-radius:999px;padding:5px 9px 5px 5px;color:#edf6ff;background:#14243a;text-decoration:none}.member-person:hover{border-color:#84c7ff}.member-person-avatar{display:grid;place-items:center;width:28px;height:28px;overflow:hidden;border-radius:50%;background:#315273;font-size:9px;font-weight:900}.member-person-avatar img{width:100%;height:100%;object-fit:cover}.member-person span:last-child{overflow:hidden;font-size:11px;font-weight:800;text-overflow:ellipsis;white-space:nowrap}@media(max-width:650px){.member-asset-grid,.member-code-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:410px){.member-asset-grid,.member-code-grid{grid-template-columns:1fr}}
  </style>
  <style>
    .member-follow{align-self:center;margin-left:auto;border:1px solid rgba(128,225,120,.65);border-radius:9px;padding:8px 12px;color:#d7ffd0;background:rgba(64,153,62,.2);font:900 11px Inter,Arial,sans-serif;cursor:pointer}.member-follow.is-following{border-color:rgba(143,188,244,.45);color:#dceeff;background:rgba(86,145,207,.17)}.member-ad{position:relative;min-height:122px}.member-ad-desktop,.member-ad-mobile{display:block}.member-ad-mobile{display:none}.member-ad-progress{width:min(728px,100%);height:3px;overflow:hidden;margin-top:7px;border-radius:99px;background:rgba(135,165,213,.19)}.member-ad-progress i{display:block;width:100%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#66c8ff,#8271ff);transform:scaleX(0);transform-origin:left}@media(max-width:650px){.member-ad{min-height:82px}.member-ad-desktop{display:none}.member-ad-mobile{display:block}.member-ad iframe{transform:none}}
  </style>

<body>
  <script src="/global-shell.js?v=20260922-tool-interstitial"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <main class="members-page">
    <a class="member-back" id="memberBack" href="/community">← Back to Community</a>
    <section class="member-card" id="memberCard" aria-live="polite"><div class="member-state"><h1>Loading member profile…</h1><p>Getting the latest public profile details.</p></div></section>
    <div class="member-content" id="memberContent" hidden></div>
  </main>
  <script>
    (function(){
      var card=document.getElementById('memberCard');
      var content=document.getElementById('memberContent');
      var back=document.getElementById('memberBack');
      function authHeaders(extra){var headers=extra||{};var token='';try{token=localStorage.getItem('rblxtools_auth_token')||'';}catch(_error){}if(token)headers.Authorization='Bearer '+token;return headers;}
      (function configureBackLink(){var source='';try{source=document.referrer?new URL(document.referrer):null;}catch(_error){}if(!source||source.origin!==location.origin)return;var path=source.pathname.replace(/\/$/,'')||'/';var labels={'/community':'Community','/codes':'Roblox Codes','/clothing':'Clothing','/ai-ugc-studio':'AI UGC Studio','/account-overview':'Account Center'};var label=labels[path]||'previous page';back.textContent='← Back to '+label;back.href=source.href;})();
      function escapeHtml(value){return String(value||'').replace(/[&<>"']/g,function(char){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[char];});}
      function initials(value){return String(value||'Member').trim().split(/\s+/).slice(0,2).map(function(part){return part.charAt(0).toUpperCase();}).join('')||'M';}
      function failure(title,message){card.innerHTML='<div class="member-state"><h1>'+escapeHtml(title)+'</h1><p>'+escapeHtml(message)+'</p></div>';}
      function profileCommentsMarkup(comments){if(!comments.length)return '<p class="member-empty">No comments yet. Start the conversation.</p>';return '<div class="member-profile-comments">'+comments.map(function(comment){var avatar=comment.avatarUrl?'<img src="'+escapeHtml(comment.avatarUrl)+'" alt="">':escapeHtml(initials(comment.authorName));var when=comment.createdAt?new Date(comment.createdAt).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'';return '<article class="member-profile-comment"><a class="member-comment-avatar" href="/members/'+encodeURIComponent(comment.userId)+'">'+avatar+'</a><div class="member-comment-copy"><a href="/members/'+encodeURIComponent(comment.userId)+'">'+escapeHtml(comment.authorName)+'</a><time>'+escapeHtml(when)+'</time><p>'+escapeHtml(comment.body)+'</p></div></article>';}).join('')+'</div>';}
      function profileContentMarkup(payload){var assets=payload.aiAssets||[],codes=payload.codePosts||[],comments=payload.comments||[];var assetMarkup=assets.length?'<div class="member-asset-grid">'+assets.map(function(asset){var cover=asset.thumbnailUrl?'<img src="'+escapeHtml(asset.thumbnailUrl)+'" alt="'+escapeHtml(asset.title||'UGC asset')+'" data-member-asset-cover="'+escapeHtml(asset.id)+'" loading="eager" decoding="async" onerror="this.dataset.coverFailed=\'true\'">':'';return '<a class="member-asset" href="/community#asset-'+encodeURIComponent(asset.id)+'">'+cover+'<span class="member-card-copy"><strong>'+escapeHtml(asset.title||'AI asset')+'</strong><small>'+Number(asset.views||0)+' views · '+(asset.rating?escapeHtml(asset.rating)+' ★':'New')+'</small></span></a>';}).join('')+'</div>':'<p class="member-empty">No public AI assets yet.</p>';var codeMarkup=codes.length?'<div class="member-code-grid">'+codes.map(function(code){return '<a class="member-code" href="/codes/'+encodeURIComponent(code.slug)+'">'+(code.icon?'<img src="'+escapeHtml(code.icon)+'" alt="">':'<span class="member-code-fallback">CODE</span>')+'<span class="member-code-copy"><strong>'+escapeHtml(code.name)+'</strong><small>'+Number(code.workingCodeCount||0)+' codes · '+Number(code.viewCount||0)+' views</small></span></a>';}).join('')+'</div>':'<p class="member-empty">No published code posts yet.</p>';return '<section class="member-section"><h2>AI Assets ('+assets.length+')</h2>'+assetMarkup+'</section><section class="member-section"><h2>Code posts ('+codes.length+')</h2>'+codeMarkup+'</section><section class="member-section"><h2>Profile comments ('+comments.length+')</h2>'+profileCommentsMarkup(comments)+'<form class="member-comment-form" id="memberCommentForm"><textarea maxlength="600" required placeholder="Leave a comment on this profile..."></textarea><p class="member-comment-status" id="memberCommentStatus"></p><button type="submit">Post comment</button></form></section>';}
      function renderProfileAssetModelCover(image){var assetId=String(image.dataset.memberAssetCover||'');if(!assetId||image.dataset.modelCoverLoading)return;image.dataset.modelCoverLoading='true';if(!window.THREE||!THREE.GLTFLoader)return;fetch('/api/ugc/community/'+encodeURIComponent(assetId)+'/model',{credentials:'include'}).then(function(response){if(!response.ok)throw new Error('Could not load model');return response.arrayBuffer();}).then(function(buffer){var loader=new THREE.GLTFLoader();return new Promise(function(resolve,reject){loader.parse(buffer,'',resolve,reject);});}).then(function(gltf){if(!image.isConnected)return;var width=Math.max(160,image.clientWidth),height=Math.max(128,image.clientHeight);var renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));renderer.setSize(width,height,false);renderer.outputEncoding=THREE.sRGBEncoding;var scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xeaf3ff,0x0a121e,1.55));var key=new THREE.DirectionalLight(0xffffff,1.9);key.position.set(3,4,5);scene.add(key);var rim=new THREE.DirectionalLight(0x79b5ff,1.15);rim.position.set(-4,2,-3);scene.add(rim);var content=new THREE.Group();content.add(gltf.scene);var box=new THREE.Box3().setFromObject(content),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3()),maxDimension=Math.max(size.x,size.y,size.z)||1;content.position.sub(center);content.scale.setScalar(2.35/maxDimension);content.rotation.y=-.35;scene.add(content);var camera=new THREE.PerspectiveCamera(34,width/height,.01,1000);camera.position.set(0,.08,4.2);camera.lookAt(0,0,0);renderer.render(scene,camera);image.removeAttribute('onerror');image.src=renderer.domElement.toDataURL('image/png');image.dataset.coverFailed='';renderer.dispose();}).catch(function(){});}
      function bindProfileAssetCovers(root){Array.prototype.forEach.call(root.querySelectorAll('[data-member-asset-cover]'),function(image){var loadModel=function(){renderProfileAssetModelCover(image);};image.addEventListener('error',loadModel,{once:true});if(image.dataset.coverFailed==='true'||(image.complete&&!image.naturalWidth))loadModel();});}
      var memberId=decodeURIComponent(location.pathname.replace(/^\/members\/?/,'').split('/')[0]||'');
      if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(memberId)){failure('Member not found','That profile link is not valid.');return;}
      fetch('/api/members/'+encodeURIComponent(memberId),{credentials:'include',headers:authHeaders()}).then(function(response){return response.json().then(function(payload){if(!response.ok)throw new Error(payload.error||'This member is unavailable.');return payload;});}).then(function(payload){
        var member=payload.member||{},plan=String(member.plan||'free').toLowerCase(),joined=member.joinedAt?new Date(member.joinedAt):null,joinedText=joined&&!isNaN(joined.getTime())?joined.toLocaleDateString(undefined,{month:'long',year:'numeric'}):'Recently';
        var avatar=member.avatarUrl?'<img src="'+escapeHtml(member.avatarUrl)+'" alt="">':escapeHtml(initials(member.name));
        var planLabel=plan==='pro'?'Pro&nbsp;Plan':plan==='plus'?'Plus&nbsp;Plan':'';
        var stats=payload.stats||{};
        var adminIdMarkup=payload.canViewMemberId?'<div style="display:flex;align-items:center;gap:5px;max-width:100%;margin-top:7px;color:#8498b0;font-size:9px;font-weight:750;letter-spacing:.015em">User ID: <code style="overflow:hidden;color:inherit;font:inherit;text-overflow:ellipsis;white-space:nowrap">'+escapeHtml(memberId)+'</code><button type="button" data-copy-member-id aria-label="Copy user ID" title="Copy user ID" style="display:grid;place-items:center;width:18px;height:18px;flex:0 0 auto;border:0;padding:0;color:#a9c9eb;background:transparent;font:900 14px/1 Arial,sans-serif;cursor:pointer">⧉</button></div>':'';
        card.innerHTML='<div class="member-card-inner"><div class="member-top"><div class="member-avatar">'+avatar+'</div><div class="member-copy"><h1>'+escapeHtml(member.name||'Member')+'</h1>'+(planLabel?'<span class="member-plan '+(plan==='pro'?'is-pro':'is-plus')+'">'+planLabel+'</span>':'')+adminIdMarkup+'</div>'+(payload.canFollow?'<button type="button" class="member-follow'+(payload.viewerFollowing?' is-following':'')+'" data-member-follow>'+ (payload.viewerFollowing?'Following':'Follow') +'</button>':'')+'</div><div class="member-stats"><div class="member-stat"><strong data-member-follower-count>'+Number(payload.followerCount||0)+'</strong>Followers</div><div class="member-stat"><strong>'+Number(payload.followingCount||0)+'</strong>Following</div><div class="member-stat"><strong>'+Number(stats.aiTokensTipped||0).toLocaleString()+'</strong>Tokens tipped</div><div class="member-stat"><strong>'+Number(stats.codeVotes||0)+'</strong>Code votes</div><div class="member-stat"><strong>'+Number(stats.codeReports||0)+'</strong>Reports</div></div></div>';
        var avatarImage=card.querySelector('.member-avatar img');
        if(avatarImage) avatarImage.addEventListener('error',function(){avatarImage.remove();var avatarNode=card.querySelector('.member-avatar');if(avatarNode)avatarNode.textContent=initials(member.name);},{once:true});
        var copyMemberId=card.querySelector('[data-copy-member-id]');if(copyMemberId)copyMemberId.addEventListener('click',function(){var original=copyMemberId.textContent;if(!navigator.clipboard||!navigator.clipboard.writeText)return;navigator.clipboard.writeText(memberId).then(function(){copyMemberId.textContent='✓';window.setTimeout(function(){copyMemberId.textContent=original;},1200);}).catch(function(){});});
        var followButton=card.querySelector('[data-member-follow]');if(followButton)followButton.addEventListener('click',function(){followButton.disabled=true;fetch('/api/ugc/community/creators/'+encodeURIComponent(memberId)+'/follow',{method:'POST',credentials:'include',headers:authHeaders({'Content-Type':'application/json'})}).then(function(response){return response.json().then(function(result){if(!response.ok)throw new Error(result.error||'Could not update follow.');return result;});}).then(function(result){payload.viewerFollowing=Boolean(result.following);payload.followerCount=Number(result.followers||0);followButton.textContent=payload.viewerFollowing?'Following':'Follow';followButton.classList.toggle('is-following',payload.viewerFollowing);var followerCount=card.querySelector('[data-member-follower-count]');if(followerCount)followerCount.textContent=payload.followerCount;}).catch(function(error){alert(error.message||'Could not update follow.');}).finally(function(){followButton.disabled=false;});});
        function renderProfileContent(){content.innerHTML=profileContentMarkup(payload);content.hidden=false;bindProfileAssetCovers(content);mountProfileAds(payload);var form=content.querySelector('#memberCommentForm'),status=content.querySelector('#memberCommentStatus');if(form)form.addEventListener('submit',function(event){event.preventDefault();var textarea=form.querySelector('textarea'),button=form.querySelector('button'),body=textarea.value.trim();if(!body)return;button.disabled=true;status.textContent='Posting…';fetch('/api/members/'+encodeURIComponent(memberId)+'/comments',{method:'POST',credentials:'include',headers:authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({body:body})}).then(function(response){return response.json().then(function(result){if(!response.ok)throw new Error(result.error||'Could not post your comment.');return result;});}).then(function(result){payload.comments=(payload.comments||[]).concat([result.comment]);renderProfileContent();}).catch(function(error){status.textContent=error.message||'Could not post your comment.';button.disabled=false;});});}
        renderProfileContent();
        document.title=(member.name||'Member')+' | RBLXTools';
      }).catch(function(error){failure('Member unavailable',error.message||'This profile could not be loaded.');});
    }());
  </script>
</body>
