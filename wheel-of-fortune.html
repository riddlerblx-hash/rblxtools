  <section class="wheel-modal" id="wheelRedeemModal" hidden role="dialog" aria-modal="true" aria-labelledby="wheelRedeemTitle"><div class="wheel-modal-card"><h2 id="wheelRedeemTitle">Add a spin</h2><p>Enter the promo code from the end of another creator’s RBLXTools referral link. Each account can receive one referral spin ticket.</p><input id="wheelReferralCode" maxlength="20" autocomplete="off" placeholder="Promo code"><div class="wheel-modal-actions"><button class="wheel-modal-cancel" id="wheelModalCancel" type="button">Cancel</button><button class="wheel-modal-redeem" id="wheelModalRedeem" type="button">Get ticket</button></div></div></section>

  <script>
    (function(){

        fallbackGroup('jackpot',[['coupon-100','100% off coupon','coupon'],['xp-100000','100,000 XP','xp'],['xp-250000','250,000 XP','xp'],['xp-500000','500,000 XP','xp'],['xp-1500000','1,500,000 XP','xp'],['points-25000','25,000 RBLX Points','points'],['points-50000','50,000 RBLX Points','points'],['tokens-10000','10,000 AI Tokens','tokens'],['bot-365','365 day Discord Bot license','discord_license'],['plus-365','365 days of Plus','membership'],['pro-365','365 days of Pro','membership']])
      );}
      var prizes=fallbackPrizes(),wheelSlots=[],tickets=0,rotation=0,spinning=false,autoReferralAttempted=false;
      var disc=document.getElementById('wheelDisc'),labels=document.getElementById('wheelLabels'),rail=document.getElementById('wheelPrizeRail'),count=document.getElementById('wheelTicketCount'),spinButton=document.getElementById('wheelSpinButton'),redeemButton=document.getElementById('wheelRedeemButton'),status=document.getElementById('wheelStatus'),modal=document.getElementById('wheelRedeemModal'),codeInput=document.getElementById('wheelReferralCode'),recent=document.getElementById('wheelRecent'),result=document.getElementById('wheelResult');
      function token(){try{return localStorage.getItem('rblxtools_auth_token')||'';}catch(_){return'';}}
      function request(url,options){options=options||{};options.credentials='include';options.headers=Object.assign({},options.headers||{},token()?{Authorization:'Bearer '+token()}:{});return fetch(url,options).then(function(response){return response.json().catch(function(){return{};}).then(function(data){if(!response.ok)throw new Error(data.error||'Something went wrong.');return data;});});}
      function icon(prize){return prize.kind==='tokens'?'✦':prize.kind==='points'?'◆':prize.kind==='membership'?'★':prize.kind==='discord_license'?'☍':prize.kind==='coupon'?'%':'⚡';}

      function renderPrizes(){var slice=360/Math.max(wheelSlots.length,1),stops=[],cursor=0;wheelSlots.forEach(function(prize){var next=cursor+slice/3.6;stops.push(escapeHtml(prize.color)+' '+cursor+'% '+next+'%');cursor=next;});disc.style.background='conic-gradient(from -25.7deg,'+stops.join(',')+')';labels.innerHTML=wheelSlots.map(function(prize,index){return '<span class="wheel-label" style="--angle:'+((index+.5)*slice)+'deg">'+escapeHtml(prize.label)+'</span>';}).join('');var cards=prizes.map(function(prize){return '<article class="wheel-prize-card" style="--prize-color:'+escapeHtml(prize.color)+'"><span class="wheel-prize-icon">'+icon(prize)+'</span><strong>'+escapeHtml(prize.label)+'</strong><small>'+escapeHtml(prize.rarityLabel||'Wheel')+' reward</small></article>';}).join('');rail.innerHTML='<div class="wheel-prize-track">'+cards+cards+'</div>';}
