<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Purchase Complete | RBLXTools</title>
  <meta name="robots" content="noindex">
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 15% 12%,#273b6955,transparent 33%),radial-gradient(circle at 86% 88%,#f1315360,transparent 37%),#070c15;color:#f7f9ff}.success{position:relative;width:min(700px,calc(100vw - 32px));padding:clamp(28px,6vw,58px);overflow:hidden;border:1px solid #7becc388;border-radius:29px;background:linear-gradient(145deg,#14233c,#090f1c 65%);box-shadow:0 35px 100px #000a,inset 0 1px #ffffff13;text-align:center}.glow{position:absolute;width:360px;height:360px;left:50%;top:-210px;transform:translateX(-50%);border-radius:50%;background:#5effbe38;filter:blur(15px)}.eyebrow{position:relative;margin:5px 0 9px;color:#88f4c8;font-size:11px;font-weight:900;letter-spacing:.16em}.success h1{position:relative;margin:0;font-size:clamp(34px,7vw,58px);letter-spacing:-.06em}.copy{position:relative;max-width:500px;margin:14px auto 0;color:#b8c7dc;font-size:15px;line-height:1.55}.order{position:relative;display:grid;grid-template-columns:1fr auto;gap:12px;margin:31px auto 0;padding:17px 20px;border-top:1px solid #9db5db2e;border-bottom:1px solid #9db5db2e;text-align:left}.order span{color:#99aac1;font-size:12px;font-weight:800}.order strong{font-size:15px}.order strong:last-child{text-align:right}.status{position:relative;min-height:20px;margin:19px 0 0;color:#a7b8cf;font-size:12px;font-weight:750}.status.error{color:#ffabb5}.actions{position:relative;display:flex;justify-content:center;align-items:center;gap:11px;margin-top:23px}.actions a,.actions button{display:inline-flex;align-items:center;justify-content:center;min-width:142px;min-height:48px;padding:0 19px;border:1px solid #54729b;border-radius:12px;background:#17263d;color:#eef5ff;font:850 13px/1 inherit;text-align:center;text-decoration:none;cursor:pointer}.actions a.primary{border-color:#56edb0;background:linear-gradient(135deg,#38d994,#1a9c71);color:#03140e;box-shadow:0 10px 30px #20dc9b3e}.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}.confetti i{position:absolute;top:-18px;width:9px;height:17px;border-radius:2px;background:var(--c);left:var(--x);animation:fall var(--d) cubic-bezier(.2,.7,.4,1) var(--delay) infinite;transform:rotate(var(--r))}@keyframes fall{to{transform:translate3d(var(--drift),760px,0) rotate(620deg);opacity:0}}@media(max-width:520px){.success{padding:30px 21px}.actions{flex-direction:column}.actions a,.actions button{width:100%}}
    .admin-preview-picker{position:fixed;z-index:3;top:18px;left:50%;display:none;align-items:center;gap:9px;transform:translateX(-50%);padding:8px 11px;border:1px solid #5576a5;border-radius:12px;background:#0d182bd9;box-shadow:0 12px 30px #0007;color:#c7d9f1;font-size:11px;font-weight:900;backdrop-filter:blur(14px)}.admin-preview-picker select{border:1px solid #5576a5;border-radius:8px;background:#172944;color:#fff;padding:7px 28px 7px 9px;font:800 12px inherit}body.admin-preview .admin-preview-picker{display:flex}
  </style>
</head>
<body>
  <label class="admin-preview-picker" for="adminPreviewProduct">Preview product <select id="adminPreviewProduct"><option value="tokens">AI token pack</option><option value="plus">Plus membership</option><option value="pro">Pro membership</option><option value="discord">Discord Bot license</option></select></label>
  <main class="success" aria-live="polite">
    <div class="confetti" aria-hidden="true" id="confetti"></div><div class="glow" aria-hidden="true"></div>
    <div class="eyebrow">PURCHASE COMPLETE</div>
    <h1>Congratulations!</h1>
    <p class="copy" id="copy">Your purchase was successful. We are preparing your RBLXTools access now.</p>
    <div class="order"><span id="item">Your RBLXTools purchase</span><strong id="amount">—</strong></div>
    <p class="status" id="status">Confirming your purchase…</p>
    <div class="actions"><a class="primary" id="return" href="./">Back to RBLXTools</a><a href="./account">View account</a></div>
  </main>
  <script>
  (function(){
    var params=new URLSearchParams(location.search),sessionId=params.get('session_id')||'',adminPreview=params.get('admin_preview')==='1',status=document.getElementById('status'),copy=document.getElementById('copy'),token=function(){try{return localStorage.getItem('rblxtools_auth_token')||''}catch(_){return ''}},headers=function(){return {'Content-Type':'application/json',Authorization:'Bearer '+token()}},safeReturn=function(){try{var saved=sessionStorage.getItem('rblxtools_checkout_return_to')||'';var url=new URL(saved,location.origin);if(url.origin===location.origin&&!/^\/(?:checkout|purchase-success)(?:\/|$)/.test(url.pathname)){sessionStorage.removeItem('rblxtools_checkout_return_to');return url.pathname+url.search+url.hash}}catch(_){}return './'},makeConfetti=function(){var colors=['#69f2c1','#ff5570','#6baaff','#ffd367','#b387ff'];var root=document.getElementById('confetti'),html='';for(var i=0;i<55;i++)html+='<i style="--x:'+Math.round(Math.random()*100)+'%;--c:'+colors[i%colors.length]+';--d:'+(2.7+Math.random()*2.8).toFixed(2)+'s;--delay:'+(-Math.random()*3).toFixed(2)+'s;--r:'+Math.round(Math.random()*180)+'deg;--drift:'+Math.round(-140+Math.random()*280)+'px"></i>';root.innerHTML=html};
    document.getElementById('return').href=safeReturn();makeConfetti();
    if(adminPreview){var products={tokens:{item:'20 AI Generation Tokens',amount:'$0.00',copy:'Your AI tokens are now being added to your balance. Enjoy creating!'},plus:{item:'RBLXTools Plus',amount:'$1.00',copy:'Your Plus membership is active and ready to use.'},pro:{item:'RBLXTools Pro',amount:'$5.00',copy:'Your Pro membership is active and ready to use.'},discord:{item:'Discord Bot license',amount:'$9.99',copy:'Your Discord Bot access is active and ready to use.'}},choice=params.get('preview_product')||'tokens',product=products[choice]||products.tokens,picker=document.getElementById('adminPreviewProduct');document.body.classList.add('admin-preview');document.getElementById('return').href='./';item.textContent=product.item;amount.textContent=product.amount;copy.textContent=product.copy;status.textContent='Everything is ready — enjoy your purchase!';picker.value=products[choice]?choice:'tokens';picker.addEventListener('change',function(){params.set('preview_product',this.value);location.search=params.toString()});return}
    if(!sessionId){status.textContent='Your purchase is complete. You can return to RBLXTools whenever you are ready.';return}
    fetch('/auth/checkout-session-summary?session_id='+encodeURIComponent(sessionId),{credentials:'include',headers:headers()}).then(function(r){return r.json().then(function(p){if(!r.ok)throw Error(p&&p.error||'Your payment was received and is still being confirmed.');return p})}).then(function(summary){document.getElementById('item').textContent=summary.itemName||'Your RBLXTools purchase';document.getElementById('amount').textContent=summary.amountTotalFormatted||'Paid';var confirmUrl='',body={sessionId:sessionId};if(summary.aiTokenQuantity){confirmUrl='/store/confirm-ai-token-checkout'}else if(summary.productType==='discord_bot_unlimited'){confirmUrl='/store/confirm-discord-bot-unlimited-checkout'}else if(summary.productType==='discord_bot_uses'){confirmUrl='/store/confirm-discord-bot-use-checkout'}if(!confirmUrl)return summary;return fetch(confirmUrl,{method:'POST',credentials:'include',headers:headers(),body:JSON.stringify(body)}).then(function(r){return r.json().then(function(p){if(!r.ok)throw Error(p&&p.error||'Your payment was received and is still being finalized.');return summary})}).then(function(){return summary})}).then(function(summary){if(summary&&summary.aiTokenQuantity)copy.textContent='Your AI tokens are now being added to your balance. Enjoy creating!';else copy.textContent='Thank you for supporting RBLXTools. Your purchase is active and ready to use.';status.textContent='Everything is ready — enjoy your purchase!'}).catch(function(error){status.className='status error';status.textContent=error.message||'Your payment was received and will appear shortly.'});
  }());
  </script>
</body>
</html>
