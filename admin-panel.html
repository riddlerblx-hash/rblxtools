<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Panel - RBLXTools</title>
  <meta name="description" content="Manage moderation, memberships, chat controls, and admin actions inside the RBLXTools admin panel." />
  <meta name="robots" content="noindex, nofollow" />
  <style>
    :root {
      --admin-bg: #0b0d12;
      --admin-surface: #11151d;
      --admin-surface-2: #171c26;
      --admin-surface-3: #1d2430;
      --admin-line: rgba(255, 255, 255, 0.08);
      --admin-line-strong: rgba(255, 255, 255, 0.13);
      --admin-text: #f4f7fb;
      --admin-muted: #9eacc0;
      --admin-blue: #6ea9ff;
      --admin-green: #53df88;
      --admin-red: #ff6258;
      --admin-yellow: #ffcc6b;
      --admin-shadow: 0 24px 56px rgba(0, 0, 0, 0.34);
      --admin-radius: 20px;
      --admin-font: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top left, rgba(110, 169, 255, 0.1), transparent 24%),
        radial-gradient(circle at bottom right, rgba(83, 223, 136, 0.08), transparent 24%),
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(180deg, #0d1016 0%, #090b10 100%);
      background-size: auto, auto, 28px 28px, 28px 28px, auto;
      color: var(--admin-text);
      font-family: var(--admin-font);
    }

    body {
      padding: 16px;
    }

    .admin-panel {
      display: grid;
      gap: 14px;
    }

    .admin-pin-lock {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(5, 7, 10, 0.86);
      backdrop-filter: blur(10px);
    }

    .admin-pin-lock[hidden] {
      display: none !important;
    }

    .admin-pin-card {
      width: min(420px, calc(100vw - 32px));
      padding: 22px;
      border-radius: 24px;
      border: 1px solid var(--admin-line);
      background:
        radial-gradient(circle at top right, rgba(110, 169, 255, 0.16), transparent 28%),
        linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02)),
        rgba(12, 16, 22, 0.98);
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .admin-pin-title {
      margin: 10px 0 0;
      font-size: 28px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .admin-pin-copy {
      margin: 10px 0 0;
      color: var(--admin-muted);
      font-size: 12px;
      line-height: 1.6;
      font-weight: 700;
    }

    .admin-pin-form {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    .admin-pin-input {
      text-align: center;
      letter-spacing: 0.35em;
      font-size: 18px;
      font-weight: 900;
      padding-left: calc(12px + 0.35em);
    }

    .admin-topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 16px 18px;
      border-radius: 24px;
      border: 1px solid var(--admin-line);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02)),
        rgba(11, 15, 21, 0.94);
      box-shadow: var(--admin-shadow);
    }

    .admin-title-wrap {
      min-width: 0;
    }

    .admin-kicker {
      color: #ffb3ad;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .admin-title {
      margin: 6px 0 0;
      font-size: 28px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .admin-copy {
      margin: 8px 0 0;
      color: var(--admin-muted);
      font-size: 12px;
      line-height: 1.55;
      font-weight: 700;
      max-width: 70ch;
    }

    .admin-badges {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .admin-pill {
      min-height: 28px;
      padding: 0 11px;
      border-radius: 999px;
      border: 1px solid var(--admin-line);
      background: rgba(255,255,255,0.04);
      color: #eef4ff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .admin-pill.live {
      background: linear-gradient(180deg, #70abff 0%, #3a78eb 100%);
      border-color: rgba(110, 169, 255, 0.22);
    }

    .admin-overview {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.9fr);
      gap: 14px;
    }

    .admin-card {
      border-radius: var(--admin-radius);
      border: 1px solid var(--admin-line);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.02)),
        var(--admin-surface);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
      overflow: hidden;
    }

    .admin-card-inner {
      padding: 15px;
    }

    .admin-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .admin-card-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: -0.6px;
    }

    .admin-card-copy {
      margin: 0;
      color: var(--admin-muted);
      font-size: 11px;
      line-height: 1.5;
      font-weight: 700;
    }

    .admin-status-grid,
    .admin-actions-grid,
    .admin-compact-grid {
      display: grid;
      gap: 12px;
    }

    .admin-status-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .admin-status-box {
      padding: 12px;
      border-radius: 16px;
      border: 1px solid var(--admin-line);
      background: rgba(255,255,255,0.035);
      min-width: 0;
    }

    .admin-status-label,
    .admin-label {
      display: block;
      color: #ffb3ad;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.9px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .admin-status-value {
      color: #fff;
      font-size: 18px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.6px;
      word-break: break-word;
    }

    .admin-status-copy {
      margin-top: 6px;
      color: var(--admin-muted);
      font-size: 11px;
      line-height: 1.45;
      font-weight: 700;
    }

    .admin-actions-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: start;
    }

    .admin-compact-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .admin-field {
      margin-bottom: 10px;
    }

    .admin-input,
    .admin-textarea {
      width: 100%;
      border-radius: 13px;
      border: 1px solid var(--admin-line);
      background: rgba(8, 10, 15, 0.6);
      color: #fff;
      font: inherit;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .admin-input {
      min-height: 42px;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 800;
    }

    .admin-textarea {
      min-height: 78px;
      resize: vertical;
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.45;
      font-weight: 700;
    }

    .admin-input:focus,
    .admin-textarea:focus {
      border-color: rgba(110, 169, 255, 0.72);
      box-shadow: 0 0 0 3px rgba(110, 169, 255, 0.12);
    }

    .admin-split {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(104px, 0.48fr);
      gap: 10px;
    }

    .admin-triple {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .admin-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .admin-btn {
      min-height: 40px;
      padding: 0 12px;
      border: 0;
      border-radius: 12px;
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.14s ease, filter 0.14s ease;
    }

    .admin-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    .admin-btn:disabled {
      opacity: 0.58;
      cursor: wait;
    }

    .admin-btn.blue {
      background: linear-gradient(180deg, #74acff 0%, #407def 100%);
      box-shadow: 0 14px 28px rgba(64, 125, 239, 0.22);
    }

    .admin-btn.green {
      background: linear-gradient(180deg, #58e18d 0%, #22b962 100%);
      box-shadow: 0 14px 28px rgba(34, 185, 98, 0.22);
    }

    .admin-btn.red {
      background: linear-gradient(180deg, #ff6f66 0%, #df342b 100%);
      box-shadow: 0 14px 28px rgba(223, 52, 43, 0.22);
    }

    .admin-btn.ghost {
      background: rgba(255,255,255,0.07);
      border: 1px solid var(--admin-line-strong);
      box-shadow: none;
    }

    .admin-result {
      min-height: 18px;
      margin-top: 10px;
      color: #d6e0ee;
      font-size: 11px;
      line-height: 1.5;
      font-weight: 800;
    }

    .admin-result.success {
      color: #88f2b2;
    }

    .admin-result.error {
      color: #ff9a93;
    }

    .admin-member-card {
      min-height: 100%;
      display: grid;
      align-content: start;
      gap: 12px;
    }

    .admin-member-empty {
      padding: 16px;
      border-radius: 16px;
      border: 1px dashed rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.025);
      color: var(--admin-muted);
      font-size: 12px;
      line-height: 1.55;
      font-weight: 700;
      text-align: center;
    }

    .admin-member-empty strong {
      display: block;
      margin-bottom: 6px;
      color: #fff;
      font-size: 16px;
      line-height: 1.1;
      font-weight: 900;
    }

    .admin-member-head {
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
    }

    .admin-avatar {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      border: 1px solid var(--admin-line);
      background: linear-gradient(180deg, #2c3341, #1d222d);
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      overflow: hidden;
    }

    .admin-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .admin-member-name {
      color: #fff;
      font-size: 22px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.8px;
      word-break: break-word;
    }

    .admin-member-sub {
      margin-top: 6px;
      color: var(--admin-muted);
      font-size: 12px;
      line-height: 1.4;
      font-weight: 700;
      word-break: break-word;
    }

    .admin-member-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .admin-member-box {
      padding: 11px 12px;
      border-radius: 15px;
      border: 1px solid var(--admin-line);
      background: rgba(255,255,255,0.03);
      min-width: 0;
    }

    .admin-member-box.wide {
      grid-column: 1 / -1;
    }

    .admin-member-key {
      color: #ffb3ad;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .admin-member-value {
      color: #fff;
      font-size: 12px;
      line-height: 1.45;
      font-weight: 800;
      word-break: break-word;
    }

      function normalizeLoadedMember(member, payload) {
        var nextMember = Object.assign({}, loadedMember || {}, member || {});
        if (payload && typeof payload === "object") {
          if (payload.moderation) {
            nextMember.moderation = payload.moderation;
          }
          if (payload.deviceCount != null) {
            nextMember.deviceCount = payload.deviceCount;
          }
        }
        return nextMember;
      }

      function formatMembershipSource(value) {
        var source = String(value || "").trim().toLowerCase();
        if (!source || source === "none") return "none";
        if (source === "stripe") return "stripe";
        if (source === "complimentary") return "complimentary";
        if (source === "stripe + complimentary") return "stripe + complimentary";
        if (source === "account") return "account";
        return source;
      }

      function getMembershipBreakdown(member, key) {
        if (!member || !member.membershipBreakdown || !member.membershipBreakdown[key]) {
          return null;
        }
        return member.membershipBreakdown[key];
      }

      function formatDayCount(value, fallback) {
        if (value == null || value === "") {
          return fallback;
        }
        return String(value);
      }

      function formatMemberExpiry(member) {
        var value = member && (member.plusExpiresAt || member.complimentaryExpiresAt || member.currentPeriodEndAt);
        if (!value) return "Not set";
        var date = new Date(value);
        if (isNaN(date.getTime())) return "Not set";
        return date.toLocaleString();
      }

      function clearMemberPolling() {
        if (memberPollTimer) {
          clearInterval(memberPollTimer);
          memberPollTimer = null;
        }
      }

      function startMemberPolling() {
        clearMemberPolling();
        if (!loadedMember || !loadedMember.id) return;
        memberPollTimer = setInterval(function () {
          refreshLoadedMember(true);
        }, 15000);
      }

      function renderMember(member) {
        loadedMember = member || null;

        if (!member) {
          clearMemberPolling();
          refs.memberEmpty.hidden = false;
          refs.memberView.hidden = true;
          return;
        }

        refs.memberEmpty.hidden = true;
        refs.memberView.hidden = false;
        refs.memberAvatar.innerHTML = "";
        refs.memberAvatar.textContent = getInitials(member.email || member.id || "U");
        refs.memberName.textContent = member.email ? member.email.split("@")[0] : "Member";
        refs.memberEmail.textContent = member.email || "No email on file";
        refs.memberUserId.textContent = member.id || "-";
        refs.memberPlan.textContent = getPlanLabel(member);
        refs.memberStripe.textContent = member.stripeSubscriptionStatus || "none";
        refs.memberDevices.textContent = String(member.deviceCount != null ? member.deviceCount : 0);
        refs.memberExpiry.textContent = formatMemberExpiry(member);
        refs.memberSource.textContent = formatMembershipSource(member.membershipSource);
        refs.memberPlusDaysLeft.textContent = member.plusDaysLeft != null ? String(member.plusDaysLeft) : "0";
        refs.memberStripeDaysTotal.textContent = formatDayCount(getMembershipBreakdown(member, "stripe") && getMembershipBreakdown(member, "stripe").totalDays, "-");
        refs.memberStripeDaysLeft.textContent = formatDayCount(getMembershipBreakdown(member, "stripe") && getMembershipBreakdown(member, "stripe").daysLeft, "0");
        refs.memberComplimentaryDaysTotal.textContent = formatDayCount(getMembershipBreakdown(member, "complimentary") && getMembershipBreakdown(member, "complimentary").totalDays, "-");
        refs.memberComplimentaryDaysLeft.textContent = formatDayCount(getMembershipBreakdown(member, "complimentary") && getMembershipBreakdown(member, "complimentary").daysLeft, "0");
        refs.memberModeration.textContent = formatModeration(member);
        startMemberPolling();
      }

      async function fetchJson(url, options) {
        var nextOptions = Object.assign({ credentials: "include" }, options || {});
        var response = await fetch(url, nextOptions);
        var payload = await response.json().catch(function () { return null; });

        if (!response.ok) {
          throw new Error(payload && payload.error ? payload.error : "Request failed.");
        }

        return payload || {};
      }

      async function refreshLoadedMember(isBackgroundPoll) {
        var query = loadedMember && (loadedMember.id || loadedMember.email);

        if (!query) {
          return;
        }

        try {
          var payload = await fetchJson(API_BASE + "/admin/member-lookup?q=" + encodeURIComponent(query));

          renderMember(normalizeLoadedMember(payload.member || null, payload));
          if (!isBackgroundPoll) {
            setResult("lookupStatus", "Member refreshed.", "success");
          }
        } catch (error) {
          if (!isBackgroundPoll) {
            setResult("lookupStatus", error.message || "Could not refresh that member.", "error");
          }
        }
      }

      async function lookupMember() {
        var query = getFieldValue("lookupQuery");

        if (!query) {
          setResult("lookupStatus", "Enter a user ID or email first.", "error");
          return;
        }

        refs.lookupButton.disabled = true;
        setResult("lookupStatus", "Loading member...");
        clearMemberPolling();

        try {
          var payload = await fetchJson(API_BASE + "/admin/member-lookup?q=" + encodeURIComponent(query));

          renderMember(normalizeLoadedMember(payload.member || null, payload));
          setResult("lookupStatus", "Member loaded.", "success");
        } catch (error) {
          renderMember(null);
          setResult("lookupStatus", error.message || "Lookup failed.", "error");
        } finally {
          refs.lookupButton.disabled = false;
        }
      }

      async function resolveTargetMember(targetValue) {
        var query = String(targetValue || "").trim();

        if (!query) {
          throw new Error("Enter a user ID or email first.");
        }

        if (/^guest-/i.test(query) || /^user id\s+guest-/i.test(query)) {
          throw new Error("Guest chat IDs are not real member account IDs. Use the member's real account email or UUID.");
        }

        var payload = await fetchJson(API_BASE + "/admin/member-lookup?q=" + encodeURIComponent(query));

        return payload.member || null;
      }

      function withBusy(buttonIds, fn) {
        var nodes = buttonIds.map(function (id) { return document.getElementById(id); }).filter(Boolean);
        nodes.forEach(function (node) { node.disabled = true; });
        return Promise.resolve()
          .then(fn)
          .finally(function () {
            nodes.forEach(function (node) { node.disabled = false; });
          });
      }

      async function grantPlus() {
        return withBusy(["grantPlusButton", "removePlusButton"], async function () {
          var note = getFieldValue("plusNote");
          if (!note) {
            throw new Error("A note is required before complimentary Plus can be granted.");
          }
          var target = await resolveTargetMember(getFieldValue("plusTarget"));
          var payload = await fetchJson(API_BASE + "/admin/grant-plus", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              userId: target.id,
              days: Math.max(1, Math.min(getFieldNumber("plusDays", 14), 3650)),
              note: note
            })
          });

          renderMember(normalizeLoadedMember(payload.member || target, payload));
          setResult("plusStatus", payload.message || "Complimentary Plus granted.", "success");
        }).catch(function (error) {
          setResult("plusStatus", error.message || "Could not grant Plus.", "error");
        });
      }

      async function removePlus() {
        return withBusy(["grantPlusButton", "removePlusButton"], async function () {
          var target = await resolveTargetMember(getFieldValue("plusTarget"));
          var payload = await fetchJson(API_BASE + "/admin/remove-plus", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              userId: target.id,
              note: getFieldValue("plusNote")
            })
          });

          renderMember(normalizeLoadedMember(payload.member || target, payload));
          setResult("plusStatus", payload.message || "Plus access removed.", "success");
        }).catch(function (error) {
          setResult("plusStatus", error.message || "Could not remove Plus.", "error");
        });
      }

      async function applyWebsiteLock() {
        return withBusy(["blacklistButton", "clearBlacklistButton"], async function () {
          var target = await resolveTargetMember(getFieldValue("blacklistTarget"));
          var payload = await fetchJson(API_BASE + "/admin/site-blacklist", {
            method: "POST",
            headers: {

            },

          renderMember(normalizeLoadedMember(payload.member || target, payload));
          setResult("blacklistStatus", payload.message || "Website lock applied.", "success");

      }

      async function clearWebsiteLock() {
        return withBusy(["blacklistButton", "clearBlacklistButton"], async function () {
          var target = await resolveTargetMember(getFieldValue("blacklistTarget"));
          var payload = await fetchJson(API_BASE + "/admin/clear-site-blacklist", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              userId: target.id,

            })

          renderMember(normalizeLoadedMember(payload.member || target, payload));
          setResult("blacklistStatus", payload.message || "Website lock cleared.", "success");
        }).catch(function (error) {

      }

      function getTimeoutDurationSeconds() {
        var days = Math.max(0, getFieldNumber("timeoutDays", 0));
        var hours = Math.max(0, getFieldNumber("timeoutHours", 0));
        var minutes = Math.max(0, getFieldNumber("timeoutMinutes", 0));
        return (days * 86400) + (hours * 3600) + (minutes * 60);
      }

      async function applyChatTimeout() {
        return withBusy(["timeoutButton", "clearTimeoutButton"], async function () {
          var days = Math.max(0, getFieldNumber("timeoutDays", 0));
          var hours = Math.max(0, getFieldNumber("timeoutHours", 0));
          var minutes = Math.max(0, getFieldNumber("timeoutMinutes", 0));
          var durationSeconds = (days * 86400) + (hours * 3600) + (minutes * 60);
          if (!durationSeconds) {
            throw new Error("Set at least one minute, hour, or day for the timeout.");
          }

          var target = await resolveTargetMember(getFieldValue("timeoutTarget"));
          var payload = await fetchJson(API_BASE + "/admin/chat-timeout", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              userId: target.id,
              days: days,
              hours: hours,
              minutes: minutes,
              reason: getFieldValue("timeoutReason"),
              note: getFieldValue("timeoutNote")
            })
          });

          renderMember(normalizeLoadedMember(payload.member || target, payload));
          setResult("timeoutStatus", payload.message || "Chat timeout applied.", "success");
        }).catch(function (error) {
          setResult("timeoutStatus", error.message || "Could not apply timeout.", "error");
        });
      }

      async function clearChatTimeout() {
        return withBusy(["timeoutButton", "clearTimeoutButton"], async function () {
          var target = await resolveTargetMember(getFieldValue("timeoutTarget"));
          var payload = await fetchJson(API_BASE + "/admin/clear-chat-timeout", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              userId: target.id,
              note: getFieldValue("timeoutNote")
            })
          });

          renderMember(normalizeLoadedMember(payload.member || target, payload));
          setResult("timeoutStatus", payload.message || "Chat timeout cleared.", "success");
        }).catch(function (error) {
          setResult("timeoutStatus", error.message || "Could not clear timeout.", "error");
        });
      }

      async function applyChatBan() {
        return withBusy(["chatBanButton", "clearChatBanButton"], async function () {
          var target = await resolveTargetMember(getFieldValue("chatBanTarget"));
          var payload = await fetchJson(API_BASE + "/admin/chat-ban", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              userId: target.id,
              reason: getFieldValue("chatBanReason"),
              note: getFieldValue("chatBanNote")
            })
          });

          renderMember(normalizeLoadedMember(payload.member || target, payload));
          setResult("chatBanStatus", payload.message || "Chat ban applied.", "success");
        }).catch(function (error) {
          setResult("chatBanStatus", error.message || "Could not apply chat ban.", "error");
        });
      }

      async function clearChatBan() {
        return withBusy(["chatBanButton", "clearChatBanButton"], async function () {
          var target = await resolveTargetMember(getFieldValue("chatBanTarget"));
          var payload = await fetchJson(API_BASE + "/admin/clear-chat-ban", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              userId: target.id,
              note: getFieldValue("chatBanNote")
            })
          });

          renderMember(normalizeLoadedMember(payload.member || target, payload));
          setResult("chatBanStatus", payload.message || "Chat ban cleared.", "success");
        }).catch(function (error) {
          setResult("chatBanStatus", error.message || "Could not clear chat ban.", "error");
        });
      }

      async function createClaimDrop() {
        return withBusy(["createDropButton"], async function () {
          var adminIdentity = getAdminChatIdentityMeta();
          var payload = await fetchJson(API_BASE + "/admin/create-claim-drop", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              title: getFieldValue("dropTitle"),
              days: Math.max(1, Math.min(getFieldNumber("dropDays", 14), 3650)),
              maxClaims: Math.max(1, Math.min(getFieldNumber("dropClaims", 3), 500)),
              expiresSeconds: Math.max(1, Math.min(getFieldNumber("dropSeconds", 10), 86400)),
              displayName: adminIdentity.displayName,
              username: adminIdentity.username,
              avatarUrl: adminIdentity.avatarUrl
            })
          });

          setResult("dropStatus", payload.message || "Claim drop created.", "success");
        }).catch(function (error) {
          setResult("dropStatus", error.message || "Could not create claim drop.", "error");
        });
      }

      function getRainDurationSeconds() {
        var seconds = Math.max(0, getFieldNumber("rainSeconds", 0));
        var minutes = Math.max(0, getFieldNumber("rainMinutes", 0));
        var hours = Math.max(0, getFieldNumber("rainHours", 0));
        return Math.min((hours * 3600) + (minutes * 60) + seconds, 604800);
      }

      async function startChatRain() {
        return withBusy(["startRainButton"], async function () {
          var durationSeconds = getRainDurationSeconds();
          if (!durationSeconds) {
            throw new Error("Set at least one second, minute, or hour for chat rain.");
          }

          var adminIdentity = getAdminChatIdentityMeta();
          var payload = await fetchJson(API_BASE + "/admin/start-chat-rain", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              title: getFieldValue("rainTitle"),
              days: Math.max(1, Math.min(getFieldNumber("rainDays", 14), 3650)),
              winnersCount: Math.max(1, Math.min(getFieldNumber("rainWinners", 1), 100)),
              durationSeconds: durationSeconds,
              displayName: adminIdentity.displayName,
              username: adminIdentity.username,
              avatarUrl: adminIdentity.avatarUrl
            })
          });

          setResult("rainStatus", payload.message || "Chat rain started.", "success");
        }).catch(function (error) {
          setResult("rainStatus", error.message || "Could not start chat rain.", "error");
        });
      }

      function renderAdminSession(user) {
        currentAdminUser = user || null;
        var adminIdentity = getAdminChatIdentityMeta();
        refs.currentName.textContent = adminIdentity.displayName || "Admin";
        refs.currentEmail.textContent = user && user.email ? user.email : "No email";
        refs.currentPlan.textContent = user && user.plan ? String(user.plan).toUpperCase() : "ADMIN";
        refs.currentRole.textContent = user && user.isAdmin ? "Backend approved admin access." : "Admin approval missing.";
        refs.sessionState.textContent = user && user.isAdmin ? "Ready" : "Blocked";
      }

      async function bootstrap() {
        try {
          var payload = await fetchJson(API_BASE + "/auth/me");

          var user = payload.user || payload;
          if (!user || !user.isAdmin) {
            throw new Error("This account is not approved to use the admin panel.");
          }

          renderAdminSession(user);
          setGlobalStatus("Admin session verified. All tools are ready.", "success");
          updatePinLock();
        } catch (error) {
          refs.currentName.textContent = "Access Denied";
          refs.currentEmail.textContent = "Backend rejected this account.";
          refs.currentPlan.textContent = "-";
          refs.currentRole.textContent = "Admin approval missing.";
          refs.sessionState.textContent = "Blocked";
          setGlobalStatus(error.message || "Could not verify the current account.", "error");
        }
      }

      function handlePinSubmit(event) {
        event.preventDefault();
        var entered = String(refs.pinInput.value || "").trim();
        if (!entered) {
          setPinStatus("Enter the admin pin first.", "error");
          return;
        }
        if (entered !== ADMIN_PIN) {
          refs.pinInput.value = "";
          setPinStatus("That admin pin is not correct.", "error");
          return;
        }
        panelUnlocked = true;
        refs.pinInput.value = "";
        setPinStatus("", "");
        updatePinLock();
      }

      refs.lookupButton.addEventListener("click", lookupMember);
      refs.lookupQuery.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          event.preventDefault();
          lookupMember();
        }
      });

      document.getElementById("grantPlusButton").addEventListener("click", grantPlus);
      document.getElementById("removePlusButton").addEventListener("click", removePlus);
      document.getElementById("blacklistButton").addEventListener("click", applyWebsiteLock);
      document.getElementById("clearBlacklistButton").addEventListener("click", clearWebsiteLock);
      document.getElementById("timeoutButton").addEventListener("click", applyChatTimeout);
      document.getElementById("clearTimeoutButton").addEventListener("click", clearChatTimeout);
      document.getElementById("chatBanButton").addEventListener("click", applyChatBan);
      document.getElementById("clearChatBanButton").addEventListener("click", clearChatBan);
      document.getElementById("createDropButton").addEventListener("click", createClaimDrop);
      document.getElementById("startRainButton").addEventListener("click", startChatRain);
      refs.pinForm.addEventListener("submit", handlePinSubmit);

      bootstrap();
    })();
  </script>
  <script src="./maintenance-admin.js"></script>
</body>
</html>
