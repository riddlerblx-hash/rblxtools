<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting - RBLXTools</title>
  <meta name="robots" content="noindex, nofollow">
</head>
<body>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search || "");
      var mode = params.get("mode") === "signup" ? "signup" : "login";
      var returnTo = params.get("returnTo") || document.referrer || "./index";

      try {
        sessionStorage.setItem("rblxtools_auth_modal_pending", "1");
        sessionStorage.setItem("rblxtools_auth_modal_pending_mode", mode);
      } catch (_error) {}

      try {
        var nextUrl = new URL(returnTo, window.location.href);
        nextUrl.searchParams.set("auth", mode);
        window.location.replace(nextUrl.toString());
        return;
      } catch (_error) {}

      window.location.replace("./index?auth=" + encodeURIComponent(mode));
    }());
  </script>
</body>
</html>
