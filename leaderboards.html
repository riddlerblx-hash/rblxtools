<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Leaderboards | RBLXTools</title>
  <link rel="stylesheet" href="./global-shell.css">
  <style>
    .leaderboards-page{width:min(1220px,100%);margin:0 auto;padding:28px 20px 84px;color:#edf4ff;font-family:Inter,Arial,sans-serif}.leaderboards-hero{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:22px;padding:28px;border:1px solid rgba(109,166,245,.28);border-radius:24px;background:radial-gradient(circle at 90% 0,rgba(66,193,219,.18),transparent 30%),linear-gradient(145deg,rgba(22,42,72,.93),rgba(9,18,32,.96));box-shadow:0 24px 60px rgba(0,0,0,.22)}.leaderboards-kicker{margin:0 0 9px;color:#79e8df;font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.leaderboards-hero h1{margin:0;color:#fff;font-size:clamp(31px,5vw,52px);letter-spacing:-.055em}.leaderboards-hero p{max-width:530px;margin:10px 0 0;color:#aec2dc;font-size:14px;font-weight:650;line-height:1.55}.leaderboards-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.leaderboard-card{overflow:hidden;border:1px solid rgba(114,166,239,.23);border-radius:19px;background:linear-gradient(160deg,rgba(18,35,59,.94),rgba(8,17,30,.96));box-shadow:0 18px 44px rgba(0,0,0,.18)}.leaderboard-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 19px;border-bottom:1px solid rgba(148,187,240,.14)}.leaderboard-card-head h2{margin:0;color:#f7fbff;font-size:18px;letter-spacing:-.025em}.leaderboard-card-head span{color:#8eb5df;font-size:10px;font-weight:850;letter-spacing:.08em;text-transform:uppercase}.leaderboard-list{display:grid}.leaderboard-row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:63px;padding:9px 17px;border-bottom:1px solid rgba(148,187,240,.1);color:#e8f2ff;text-decoration:none}.leaderboard-row:last-child{border-bottom:0}.leaderboard-row:hover{background:rgba(72,130,203,.12)}.leaderboard-place{display:grid;place-items:center;width:28px;height:28px;border:1px solid rgba(143,181,233,.23);border-radius:50%;color:#aebfda;background:rgba(255,255,255,.035);font-size:11px;font-weight:900}.leaderboard-row:nth-child(1) .leaderboard-place{border-color:#f5ca62;color:#ffe08a;background:rgba(218,162,36,.18)}.leaderboard-row:nth-child(2) .leaderboard-place{border-color:#c9d4df;color:#e7eef6;background:rgba(164,183,199,.16)}.leaderboard-row:nth-child(3) .leaderboard-place{border-color:#df9b72;color:#ffc5a1;background:rgba(183,99,52,.17)}.leaderboard-member{display:flex;align-items:center;min-width:0;gap:9px}.leaderboard-avatar{display:grid;place-items:center;width:34px;height:34px;overflow:hidden;flex:0 0 auto;border-radius:50%;color:#fff;background:#315275;font-size:10px;font-weight:900}.leaderboard-avatar img{width:100%;height:100%;object-fit:cover}.leaderboard-member-copy{display:grid;min-width:0;gap:3px}.leaderboard-member strong{overflow:hidden;color:#f5f8ff;font-size:12px;text-overflow:ellipsis;white-space:nowrap}.leaderboard-member small{color:#90a9c9;font-size:10px;font-weight:750}.leaderboard-value{text-align:right;color:#78eee1;font-size:13px;font-weight:950;white-space:nowrap}.leaderboard-empty{padding:27px 19px;color:#a9bad2;font-size:12px;font-weight:700}.leaderboards-status{margin:16px 0 0;color:#aebed4;font-size:12px;font-weight:700;text-align:center}@media(max-width:820px){.leaderboards-page{padding:22px 12px 66px}.leaderboards-hero{align-items:flex-start;flex-direction:column;padding:23px}.leaderboards-grid{grid-template-columns:1fr}}@media(max-width:430px){.leaderboard-row{padding:9px 12px}.leaderboard-value{font-size:11px}}
  </style>
</head>
<body>
  <script src="./global-shell.js"></script>
  <main class="leaderboards-page">
    <section class="leaderboards-hero">
      <div><p class="leaderboards-kicker">Global rankings</p><h1>Leaderboards</h1><p>See the creators and community members making the biggest impact across RBLXTools.</p></div>
    </section>
    <section class="leaderboards-grid" id="leaderboardsGrid" aria-live="polite"></section>
    <p class="leaderboards-status" id="leaderboardsStatus">Loading global rankings…</p>
  </main>
  <script>
    (function(){
      var grid=document.getElementById('leaderboardsGrid'),status=document.getElementById('leaderboardsStatus');
      var boards=[['aiTokens','AI Tokens','Available AI generation tokens'],['points','RBLX Points','Reward points earned'],['withdrawals','Top Withdrawals','Confirmed payouts'],['xp','Highest Level','Lifetime XP and level'],['tokensTipped','Most Tokens Tipped','AI tokens shared with creators']];
      function escapeHtml(value){return String(value||'').replace(/[&<>"']/g,function(char){return({'&':'&amp;','>':'&gt;','<':'&lt;','"':'&quot;',"'":'&#39;'})[char];});}
      function initials(name){return String(name||'M').trim().split(/\s+/).slice(0,2).map(function(part){return part.charAt(0).toUpperCase();}).join('')||'M';}
      function valueText(key,row){if(key==='withdrawals')return '$'+(Number(row.value||0)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});if(key==='xp')return Number(row.value||0).toLocaleString()+' XP · Lv '+Number(row.level||1);return Number(row.value||0).toLocaleString();}
      function boardMarkup(key,title,subtitle,rows){var list=rows.length?rows.map(function(row,index){var avatar=row.avatarUrl?'<img src="'+escapeHtml(row.avatarUrl)+'" alt="">':escapeHtml(initials(row.name));var badge=index===0?'Gold':index===1?'Silver':index===2?'Bronze':'';return '<a class="leaderboard-row" href="./members/'+encodeURIComponent(row.id)+'"><span class="leaderboard-place">'+(index+1)+'</span><span class="leaderboard-member"><span class="leaderboard-avatar">'+avatar+'</span><span class="leaderboard-member-copy"><strong>'+escapeHtml(row.name)+'</strong><small>'+badge+(badge?' place':'')+'</small></span></span><span class="leaderboard-value">'+valueText(key,row)+'</span></a>';}).join(''):'<p class="leaderboard-empty">No ranking data yet. Be the first to appear here.</p>';return '<section class="leaderboard-card"><div class="leaderboard-card-head"><div><h2>'+title+'</h2><span>'+subtitle+'</span></div></div><div class="leaderboard-list">'+list+'</div></section>';}
      function load(){fetch('/api/leaderboards',{credentials:'include',cache:'no-store'}).then(function(response){return response.text().then(function(text){var data;try{data=JSON.parse(text);}catch(_error){throw new Error('Leaderboard service is updating. Please try again in a moment.');}if(!response.ok)throw new Error(data.error||'Could not load leaderboards.');return data;});}).then(function(data){var values=data.leaderboards||{};grid.innerHTML=boards.map(function(board){return boardMarkup(board[0],board[1],board[2],Array.isArray(values[board[0]])?values[board[0]]:[]);}).join('');status.textContent='Live rankings · updated '+new Date().toLocaleTimeString();}).catch(function(error){status.textContent=error.message||'Could not load leaderboards.';});}
      load();window.setInterval(load,5000);
    }());
  </script>
</body>
</html>
