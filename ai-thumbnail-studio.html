<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Thumbnail Studio - RBLXTools</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="./global-shell.css?v=20260827-3" />
  <style>
    :root { --canvas:#09101c; --ink:#fbfbf2; --muted:#9da9bf; --line:rgba(255,255,255,.13); --coral:#ff4c59; --aqua:#38e6e0; --blue:#6e98ff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:radial-gradient(circle at 50% 42%,rgba(110,152,255,.16),transparent 24%),radial-gradient(circle at 81% 20%,rgba(255,76,89,.11),transparent 24%),linear-gradient(150deg,#07101c,#0c1021 52%,#080b12); font-family:Arial,sans-serif; }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; background-image:radial-gradient(rgba(255,255,255,.16) .7px,transparent .8px); background-size:19px 19px; opacity:.17; }
    .screen { position:relative; z-index:1; display:grid; min-height:calc(100vh - 50px); padding:58px 22px 96px; place-items:center; }
    .workspace { width:min(760px,100%); margin:0 auto; text-align:center; }
    .workspace.has-history { align-self:start; margin-top:24px; }
    .mark { width:58px; height:58px; display:grid; place-items:center; margin:0 auto 20px; border:1px solid rgba(56,230,224,.56); border-radius:18px; color:var(--aqua); background:linear-gradient(145deg,rgba(56,230,224,.22),rgba(110,152,255,.13)); font-size:28px; box-shadow:0 14px 32px rgba(0,0,0,.25); }
    .intro.is-history { display:none; }
    h1 { margin:0; font:900 clamp(27px,4.2vw,43px)/1.05 Georgia,serif; letter-spacing:-.045em; }
    .sub { margin:10px 0 32px; color:var(--muted); font-size:15px; }
    .prompt-card { position:relative; overflow:hidden; padding:12px; border:1px solid var(--line); border-radius:22px; background:rgba(13,21,36,.84); box-shadow:0 22px 52px rgba(0,0,0,.3); text-align:left; }
    .prompt-card.dragging { border-color:var(--aqua); box-shadow:0 0 0 4px rgba(56,230,224,.12),0 22px 52px rgba(0,0,0,.3); }
    textarea { display:block; width:100%; min-height:98px; resize:vertical; padding:13px 14px; border:0; outline:0; color:var(--ink); background:transparent; font:600 16px/1.45 Arial,sans-serif; }
    textarea::placeholder { color:#7f8aa1; }
    .reference-row { display:none; grid-template-columns:repeat(3,1fr); gap:8px; padding:2px 4px 10px; }
    .reference-row.has-images { display:grid; }
    .reference { position:relative; aspect-ratio:16/9; overflow:hidden; border:1px solid var(--line); border-radius:10px; background:#050b13; }
    .reference img { width:100%; height:100%; object-fit:cover; }
    .remove-reference { position:absolute; top:5px; right:5px; width:25px; height:25px; border:0; border-radius:50%; cursor:pointer; color:white; background:rgba(4,9,17,.78); font-weight:900; }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; border-top:1px solid rgba(255,255,255,.07); padding:10px 4px 2px; }
    .attach { display:inline-flex; align-items:center; gap:7px; cursor:pointer; color:#b8c2d5; font:800 12px/1 Arial,sans-serif; }
    .attach span { display:grid; width:28px; height:28px; place-items:center; border:1px solid rgba(110,152,255,.42); border-radius:8px; color:var(--blue); font-size:18px; }
    .attach input { display:none; }
    .counter { margin-left:auto; color:#748097; font:700 11px/1 Arial,sans-serif; }
    .token-summary { display:inline-flex; align-items:center; gap:7px; margin-left:auto; color:#b8f8f4; font:800 11px/1 Arial,sans-serif; white-space:nowrap; }
    .token-summary strong { display:grid; min-width:25px; min-height:23px; place-items:center; padding:0 6px; border:1px solid rgba(56,230,224,.3); border-radius:7px; background:rgba(56,230,224,.1); color:var(--aqua); }
    .send { width:40px; height:40px; border:0; border-radius:12px; cursor:pointer; color:#07101c; background:linear-gradient(135deg,var(--aqua),#77a5ff); font-size:19px; font-weight:900; box-shadow:0 8px 18px rgba(56,230,224,.16); }
    .send:disabled { opacity:.55; cursor:wait; }
    .status { min-height:24px; margin:14px 0 0; color:var(--muted); font:600 13px/1.45 Arial,sans-serif; }
    .status.error { color:#ffaaa9; }
    .conversation { display:none; width:min(650px,100%); margin:0 auto 26px; text-align:left; }
    .conversation.visible { display:grid; gap:20px; }
    .chat-turn { display:grid; grid-template-columns:38px minmax(0,1fr); align-items:start; gap:10px; }
    .chat-avatar { display:grid; width:36px; height:36px; place-items:center; border-radius:11px; background:linear-gradient(135deg,#335dff,#55d7ff); color:#fff; font:900 15px/1 Arial,sans-serif; }
    .chat-avatar.user { background:linear-gradient(135deg,#dc2fb9,#ff6c55); }
    .chat-copy { margin:6px 0 10px; color:#e8ecf5; font:600 14px/1.48 Arial,sans-serif; white-space:pre-wrap; }
    .chat-references { display:flex; gap:7px; flex-wrap:wrap; }
    .chat-references img { width:122px; aspect-ratio:16/9; object-fit:cover; border:1px solid var(--line); border-radius:10px; }
    .chat-output { overflow:hidden; border:1px solid var(--line); border-radius:15px; background:#050a11; box-shadow:0 18px 38px rgba(0,0,0,.3); }
    .chat-output img { display:block; width:100%; aspect-ratio:16/9; object-fit:cover; }
    .result-footer { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 13px; background:rgba(13,21,36,.92); }
    .result-footer span { color:#aab5c9; font:700 12px/1 Arial,sans-serif; }
    .download { border-radius:9px; padding:9px 11px; color:#fff; background:var(--coral); text-decoration:none; font:800 12px/1 Arial,sans-serif; }
    .result-actions { display:flex; align-items:center; gap:7px; }
    .result-action { min-width:34px; height:34px; border:1px solid rgba(255,255,255,.12); border-radius:9px; cursor:pointer; color:#d6deec; background:rgba(255,255,255,.04); font:800 15px/1 Arial,sans-serif; }
    .result-action:hover,.result-action.active { border-color:rgba(56,230,224,.62); color:var(--aqua); background:rgba(56,230,224,.12); }
    .result-action.regenerate { width:auto; padding:0 10px; color:#f3f7ff; font-size:12px; }
    .token-modal { position:fixed; z-index:30; inset:0; display:none; place-items:center; padding:20px; background:rgba(3,7,13,.72); backdrop-filter:blur(8px); }
    .token-modal.visible { display:grid; }
    .token-dialog { width:min(420px,100%); padding:25px; border:1px solid rgba(110,152,255,.35); border-radius:20px; background:linear-gradient(145deg,#121c31,#0b111d); box-shadow:0 30px 70px rgba(0,0,0,.48); text-align:left; }
    .token-dialog h2 { margin:0 0 8px; font:900 24px/1.1 Georgia,serif; }
    .token-dialog p { margin:0; color:var(--muted); font:600 14px/1.5 Arial,sans-serif; }
    .token-dialog-actions { display:flex; justify-content:flex-end; flex-wrap:wrap; gap:9px; margin-top:22px; }
    .token-dialog button { border:0; border-radius:10px; padding:10px 12px; cursor:pointer; color:#f7fbff; background:rgba(255,255,255,.08); font:800 12px/1 Arial,sans-serif; }
    .token-dialog .confirm { color:#06121b; background:linear-gradient(135deg,var(--aqua),#77a5ff); }
    .gate { display:none; width:min(440px,100%); padding:30px; border:1px solid var(--line); border-radius:22px; background:rgba(13,21,36,.92); text-align:center; box-shadow:0 22px 52px rgba(0,0,0,.3); }
    .gate.visible { display:block; }
    .gate h2 { margin:0 0 9px; font:800 25px/1 Georgia,serif; }
    .gate p { margin:0; color:var(--muted); font:600 14px/1.45 Arial,sans-serif; }
    @media(max-width:560px){ .screen{padding:42px 14px 75px}.sub{margin-bottom:23px}.toolbar{gap:7px}.counter{display:none}.token-summary{font-size:10px}.reference-row{grid-template-columns:repeat(2,1fr)}.result-footer{align-items:flex-start;flex-direction:column}.result-actions{width:100%;justify-content:space-between} }
  </style>
</head>
<body class="rblx-shell-page">
  <main class="screen">
    <section class="workspace" id="workspace" hidden>
      <section class="conversation" id="conversation" aria-live="polite"></section>
      <div class="intro" id="intro"><div class="mark">▧</div><h1>What thumbnail will you create today?</h1><p class="sub">Describe your vision or paste up to three reference images.</p></div>
      <form id="thumbnailForm">
        <div class="prompt-card" id="promptCard">
          <textarea id="prompt" maxlength="2000" required placeholder="Describe your thumbnail..."></textarea>
          <div class="reference-row" id="referenceRow"></div>
          <div class="toolbar">
            <label class="attach" title="Add up to three reference images"><span>+</span> Add references<input id="referenceInput" type="file" accept="image/png,image/jpeg,image/webp" multiple /></label>
            <span class="token-summary" title="Each thumbnail costs one AI token"><strong id="tokenBalance">0</strong><span>1 AI token</span></span>
            <span class="counter" id="counter">0 / 3 images</span>
            <button class="send" id="generateButton" type="submit" title="Generate thumbnail">↑</button>
          </div>
        </div>
      </form>
      <p class="status" id="status"></p>
    </section>
    <section class="gate" id="gate"><h2>Admin access only</h2><p id="gateMessage">Checking your account access...</p></section>
    <section class="token-modal" id="tokenModal" role="dialog" aria-modal="true" aria-labelledby="tokenDialogTitle">
      <div class="token-dialog"><h2 id="tokenDialogTitle">Use 1 AI token?</h2><p>Creating a thumbnail costs 1 AI token. You currently have <strong id="modalTokenBalance">0</strong> AI tokens.</p><div class="token-dialog-actions"><button type="button" id="cancelTokenCharge">Cancel</button><button type="button" class="confirm" id="confirmTokenCharge">Continue</button><button type="button" class="confirm" id="confirmAndHideTokenCharge">Continue &amp; don't ask again</button></div></div>
    </section>
  </main>
  <script src="./global-shell.js?v=20260827-3"></script>
  <script>
    (function () {
      var MAX_REFERENCES = 3;
      var MAX_BYTES = 1900000;
      var references = [];
      var workspace = document.getElementById('workspace');
      var gate = document.getElementById('gate');
      var gateMessage = document.getElementById('gateMessage');
      var form = document.getElementById('thumbnailForm');
      var prompt = document.getElementById('prompt');
      var input = document.getElementById('referenceInput');
      var row = document.getElementById('referenceRow');
      var counter = document.getElementById('counter');
      var card = document.getElementById('promptCard');
      var button = document.getElementById('generateButton');
      var status = document.getElementById('status');
      var conversation = document.getElementById('conversation');
      var intro = document.getElementById('intro');
      var tokenBalanceEl = document.getElementById('tokenBalance');
      var tokenModal = document.getElementById('tokenModal');
      var modalTokenBalance = document.getElementById('modalTokenBalance');
      var tokenBalance = 0;
      var TOKEN_WARNING_KEY = 'rblxtools_thumbnail_token_warning_hidden';
      function getToken() { try { return localStorage.getItem('rblxtools_auth_token') || ''; } catch (_error) { return ''; } }
      function getWarningHidden() { try { return localStorage.getItem(TOKEN_WARNING_KEY) === '1'; } catch (_error) { return false; } }
      function hideFutureWarning() { try { localStorage.setItem(TOKEN_WARNING_KEY, '1'); } catch (_error) {} }
      function setTokenBalance(value) { tokenBalance = Math.max(0, Number.parseInt(value, 10) || 0); tokenBalanceEl.textContent = String(tokenBalance); modalTokenBalance.textContent = String(tokenBalance); }
      function setStatus(message, error) { status.textContent = message || ''; status.classList.toggle('error', Boolean(error)); }
      function showGate(message) { workspace.hidden = true; gate.classList.add('visible'); gateMessage.textContent = message; }
      function appendUserTurn(message, imageUrls) {
        var turn = document.createElement('article'); turn.className = 'chat-turn';
        var imageMarkup = imageUrls.map(function (url) { return '<img src="' + url + '" alt="Reference image">'; }).join('');
        turn.innerHTML = '<div class="chat-avatar user">T</div><div><p class="chat-copy"></p>' + (imageMarkup ? '<div class="chat-references">' + imageMarkup + '</div>' : '') + '</div>';
        turn.querySelector('.chat-copy').textContent = message;
        conversation.appendChild(turn); conversation.classList.add('visible'); intro.classList.add('is-history'); workspace.classList.add('has-history');
      }
      function appendAssistantTurn(imageUrl, downloadName, sourcePrompt, sourceReferences) {
        var turn = document.createElement('article'); turn.className = 'chat-turn';
        turn.innerHTML = '<div class="chat-avatar">✦</div><div><p class="chat-copy">Here\'s your thumbnail.</p><div class="chat-output"><img alt="Generated Roblox thumbnail"><div class="result-footer"><span>1280 x 720 PNG</span><div class="result-actions"><a class="download">Download</a><button type="button" class="result-action" data-feedback="like" title="Like this thumbnail">&#128077;</button><button type="button" class="result-action" data-feedback="dislike" title="Dislike this thumbnail">&#128078;</button><button type="button" class="result-action regenerate" title="Regenerate for 1 AI token">&#8635; Regen · 1</button></div></div></div></div>';
        var output = turn.querySelector('img'); var downloadLink = turn.querySelector('.download');
        output.src = imageUrl; downloadLink.href = imageUrl; downloadLink.download = downloadName || 'rblxtools-ai-thumbnail.png';
        turn.querySelectorAll('[data-feedback]').forEach(function (feedbackButton) { feedbackButton.addEventListener('click', function () { turn.querySelectorAll('[data-feedback]').forEach(function (item) { item.classList.remove('active'); }); feedbackButton.classList.add('active'); }); });
        turn.querySelector('.regenerate').addEventListener('click', function () { beginGeneration(sourcePrompt, sourceReferences, true); });
        conversation.appendChild(turn); conversation.classList.add('visible'); turn.scrollIntoView({ behavior:'smooth', block:'nearest' });
      }
      function requestTokenApproval() {
        if (getWarningHidden()) return Promise.resolve(true);
        modalTokenBalance.textContent = String(tokenBalance); tokenModal.classList.add('visible');
        return new Promise(function (resolve) {
          function finish(result, hideForever) { tokenModal.classList.remove('visible'); if (hideForever) hideFutureWarning(); cleanup(); resolve(result); }
          function cleanup() { document.getElementById('cancelTokenCharge').removeEventListener('click', cancel); document.getElementById('confirmTokenCharge').removeEventListener('click', confirm); document.getElementById('confirmAndHideTokenCharge').removeEventListener('click', confirmAndHide); }
          function cancel() { finish(false, false); }
          function confirm() { finish(true, false); }
          function confirmAndHide() { finish(true, true); }
          document.getElementById('cancelTokenCharge').addEventListener('click', cancel);
          document.getElementById('confirmTokenCharge').addEventListener('click', confirm);
          document.getElementById('confirmAndHideTokenCharge').addEventListener('click', confirmAndHide);
        });
      }
      function renderReferences() {
        row.innerHTML = '';
        references.forEach(function (dataUrl, index) {
          var item = document.createElement('div'); item.className = 'reference';
          item.innerHTML = '<img alt="Reference ' + (index + 1) + '"><button type="button" class="remove-reference" aria-label="Remove reference">×</button>';
          item.querySelector('img').src = dataUrl;
          item.querySelector('button').addEventListener('click', function () { references.splice(index, 1); renderReferences(); });
          row.appendChild(item);
        });
        row.classList.toggle('has-images', references.length > 0);
        counter.textContent = references.length + ' / ' + MAX_REFERENCES + ' images';
      }
      function fileToDataUrl(file) { return new Promise(function (resolve, reject) { var reader = new FileReader(); reader.onload = function () { resolve(reader.result); }; reader.onerror = reject; reader.readAsDataURL(file); }); }
      function imageFromDataUrl(dataUrl) { return new Promise(function (resolve, reject) { var source = new Image(); source.onload = function () { resolve(source); }; source.onerror = reject; source.src = dataUrl; }); }
      async function compressReference(file) {
        if (!/^image\/(png|jpeg|webp)$/i.test(file.type)) throw new Error('Use PNG, JPG, or WebP reference images only.');
        var source = await imageFromDataUrl(await fileToDataUrl(file));
        var scale = Math.min(1, 1600 / Math.max(source.naturalWidth, source.naturalHeight));
        var width = Math.max(1, Math.round(source.naturalWidth * scale));
        var height = Math.max(1, Math.round(source.naturalHeight * scale));
        var canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(source, 0, 0, width, height);
        var quality = .88; var dataUrl = canvas.toDataURL('image/jpeg', quality);
        while (dataUrl.length * .75 > MAX_BYTES && quality > .42) { quality -= .12; dataUrl = canvas.toDataURL('image/jpeg', quality); }
        if (dataUrl.length * .75 > MAX_BYTES) throw new Error('That reference image is too large. Use a smaller image.');
        return dataUrl;
      }
      async function addFiles(files) {
        var incoming = Array.prototype.slice.call(files || []);
        if (!incoming.length) return;
        var available = MAX_REFERENCES - references.length;
        if (available <= 0) { setStatus('You can use up to three reference images.', true); return; }
        try {
          var prepared = await Promise.all(incoming.slice(0, available).map(compressReference));
          references = references.concat(prepared); renderReferences();
          if (incoming.length > available) setStatus('Only the first ' + available + ' image(s) were added.'); else setStatus('');
        } catch (error) { setStatus(error.message || 'Could not read that image.', true); }
      }
      input.addEventListener('change', function () { addFiles(input.files); input.value = ''; });
      card.addEventListener('dragover', function (event) { event.preventDefault(); card.classList.add('dragging'); });
      card.addEventListener('dragleave', function () { card.classList.remove('dragging'); });
      card.addEventListener('drop', function (event) { event.preventDefault(); card.classList.remove('dragging'); addFiles(event.dataTransfer.files); });
      prompt.addEventListener('paste', function (event) { var files = Array.prototype.slice.call(event.clipboardData.items || []).filter(function (item) { return item.type.indexOf('image/') === 0; }).map(function (item) { return item.getAsFile(); }).filter(Boolean); if (files.length) { event.preventDefault(); addFiles(files); } });
      async function beginGeneration(requestPrompt, requestReferences, isRegeneration) {
        if (!String(requestPrompt || '').trim()) { setStatus('Describe the thumbnail you want to create.', true); prompt.focus(); return; }
        if (tokenBalance < 1) { setStatus('No AI tokens available. Add tokens before creating another thumbnail.', true); return; }
        if (!(await requestTokenApproval())) return;
        button.disabled = true; button.textContent = '…'; setStatus('Creating your thumbnail...');
        try {
          var submittedPrompt = String(requestPrompt).trim();
          var submittedReferences = Array.isArray(requestReferences) ? requestReferences.slice() : [];
          appendUserTurn(submittedPrompt, submittedReferences);
          if (!isRegeneration) { prompt.value = ''; references = []; renderReferences(); }
          var response = await fetch('/ai/generate-thumbnail', { method:'POST', credentials:'include', headers:{ 'Content-Type':'application/json', Authorization:'Bearer ' + getToken() }, body:JSON.stringify({ prompt:submittedPrompt, references:submittedReferences }) });
          var responseText = await response.text();
          var payload = null;
          try { payload = responseText ? JSON.parse(responseText) : null; } catch (_error) { payload = null; }
          if (!response.ok) {
            if (payload && payload.aiTokens != null) setTokenBalance(payload.aiTokens);
            if (!payload && /Cannot POST \/ai\/generate-thumbnail/i.test(responseText)) throw new Error('Thumbnail backend is not deployed on the current VPS app yet.');
            throw new Error((payload && payload.error) || 'The thumbnail server returned an unexpected response.');
          }
          if (!payload || !payload.imageDataUrl) throw new Error('The thumbnail server did not return an image.');
          setTokenBalance(payload.aiTokens); window.dispatchEvent(new CustomEvent('rblxtools-ai-token-balance', { detail:{ aiTokens: payload.aiTokens } })); appendAssistantTurn(payload.imageDataUrl, payload.downloadFileName, submittedPrompt, submittedReferences); setStatus('Thumbnail ready.');
        } catch (error) { setStatus(error.message || 'Could not generate the thumbnail.', true); }
        finally { button.disabled = false; button.textContent = '↑'; }
      }
      form.addEventListener('submit', function (event) {
        event.preventDefault(); beginGeneration(prompt.value, references.slice(), false);
      });
      async function verifyAdmin() {
        try {
          var response = await fetch('/auth/me', { credentials:'include', headers:{ Authorization:'Bearer ' + getToken() } });
          var payload = await response.json().catch(function () { return null; });
          var user = payload && (payload.user || payload);
          if (!response.ok || !user || !user.isAdmin) throw new Error('This studio is only available to backend-approved admin accounts.');
          setTokenBalance(user.aiTokens);
          gate.classList.remove('visible'); workspace.hidden = false;
        } catch (error) { showGate(error.message || 'Could not verify admin access.'); setTimeout(function () { window.location.href = './index'; }, 1000); }
      }
      verifyAdmin();
    }());
  </script>
</body>
</html>
